:root{color-scheme:dark}
/* Demo app shell */
/* Agentic UX pattern demo — app-shell layer over the SDL AI UX reference styles (bundle.css + tokens.css, dark theme).

html,body{height:100%}

.sdl-avatar-init{width:var(--avatar-2xs);height:var(--avatar-2xs);border-radius:100px;background:var(--background-3);display:grid;place-items:center;font-size:.75rem;font-weight:600;flex:none}

.panel__title .sdl-icon{width:var(--icon-md);height:var(--icon-md)}

.panel__extra{display:flex;gap:var(--spacing-20)}

.panel.is-max{position:absolute;inset:0;z-index:30;box-shadow:var(--shadow-4)}

<script>
"use strict";
/* Agentic UX pattern demo — standalone Travel Copilot on the SDL AI UX reference components. */

/* ============ icons: every glyph is an iX UI icon (symbol content from the SDL design system sprite ix-icons.svg; 24px artboard, currentColor) ============ */
const IC = window.__IC__;
const ic = (n, cls = "") => `<svg class="sdl-icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ""}</svg>`;
function hydrateIcons(root = document) {
  root.querySelectorAll("i[data-ic]").forEach(i => { i.outerHTML = ic(i.dataset.ic, i.dataset.cls || ""); });
}

/* ============ the eight Agentic UX guidelines, grouped by three questions (See / Steer / Protect), never numbered ============ */
const GROUPS = [
  { k: "see", name: "See", c: "var(--data-categorical-1)", lead: "Can the human see enough to judge?" },
  { k: "steer", name: "Steer", c: "var(--data-categorical-3)", lead: "Can the human change what happens?" },
  { k: "protect", name: "Protect", c: "var(--data-categorical-5)", lead: "Does it hold for everyone, and who decided?" }
];
const groupOf = k => GROUPS.find(g => g.k === k);
const GL = {
  state: { g: "see", t: "Expose system state", d: "Show what the agent is doing right now: who it is, which step is running, done, waiting or blocked. People never have to guess." },
  awareness: { g: "see", t: "Curate the right awareness", d: "Show the signals that help a person judge: sources, confidence and the one weak spot. Not every detail, the right ones." },
  reasoning: { g: "see", t: "Make reasoning interrogable", d: "Keep the reasoning one question away. People can ask why, why not and what if, and get answers tied to evidence." },
  dialogue: { g: "steer", t: "Shape dialogue patterns", d: "Ask one targeted question, offer real options and confirm assumptions, so the conversation moves toward the person's intent." },
  control: { g: "steer", t: "Preserve human control", d: "The person decides what changes the world: approve, edit or dismiss before a commitment, stop at any time, undo afterwards." },
  feedback: { g: "steer", t: "Embed feedback loops", d: "Corrections and preferences flow back with consent, and the person can see and edit everything the agent remembers." },
  inclusive: { g: "protect", t: "Ensure inclusivity and accessibility", d: "The same safe outcome for everyone: choose depth, tone and language, have it read aloud, and use keyboard and screen reader." },
  accountable: { g: "protect", t: "Make human accountability traceable", d: "Every step names its actor, agent or human, so who decided what is readable months later." }
};
/* markers: a small info button on the component. Each belongs to one guideline and says what it does here */
const PN = {

const PANELS = {
  guide: { title: "Demo guide", icon: "about", dock: "left", state: "open", max: false, width: 380 },
  trace: { title: "Activity trace", icon: "history", dock: "right", state: "closed", max: false, width: 420 },

function buildPanel(id) {
  const P = PANELS[id];
  const p = el("section", "panel");
  p.dataset.panel = id;
  p.setAttribute("aria-label", P.title);
  p.innerHTML = `<header class="panel__head" title="Drag to a snap zone">
      <span class="panel__grip">${ic("grip", "sdl-icon--sm")}</span>
      <span class="panel__title">${ic(P.icon, "sdl-icon--sm")}<span class="ptitle">${esc(P.title)}</span></span>
      <span class="panel__extra"></span>
      <span class="panel__snap">
        <button class="sdl-icon-btn" data-act="snapl"></button><button class="sdl-icon-btn" data-act="snapr"></button>
        <button class="sdl-icon-btn" data-act="max"></button>
        <button class="sdl-icon-btn" data-act="collapse" title="Collapse to edge" aria-label="Collapse to edge"></button>
        <button class="sdl-icon-btn" data-act="close" title="Close" aria-label="Close">${ic("close")}</button>
      </span></header>
    <div class="panel__body"></div>`;
  p.querySelector(".panel__snap").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const a = b.dataset.act;
    if (a === "snapl") snapPanel(id, "left");
    if (a === "snapr") snapPanel(id, "right");
    if (a === "max") { P.max = !P.max; P.state = "open"; if (P.max) Object.keys(PANELS).forEach(k => { if (k !== id) PANELS[k].max = false; }); layoutPanels(); }
    if (a === "collapse") { P.state = "collapsed"; P.max = false; layoutPanels(); }
    if (a === "close") closePanel(id);
  });
  initDrag(p, id);
  P.el = p; P.body = p.querySelector(".panel__body");
  return p;
}
function snapPanel(id, side) { const P = PANELS[id]; P.dock = side; P.state = "open"; P.max = false; layoutPanels(); }
function openPanel(id, opts = {}) {
  const P = PANELS[id];
  if (opts.dock) P.dock = opts.dock;
  P.state = "open";
  if (isNarrow()) Object.keys(PANELS).forEach(k => { if (k !== id && PANELS[k].state === "open") PANELS[k].state = "collapsed"; });
  layoutPanels();
}
function closePanel(id) {
  const P = PANELS[id]; P.state = "closed"; P.max = false;
  if (id === "trace" && S.traceSnapped) { S.traceSnapped = false; renderAllTraces(); }
  layoutPanels();
}
function layoutPanels() {
  const docks = { left: $("#dock-left"), right: $("#dock-right") };
  Object.values(docks).forEach(d => { d.querySelector(".dock__tabs").innerHTML = ""; d.querySelector(".dock__stack").innerHTML = ""; });
  const widths = { left: 0, right: 0 };
  ["guide", "details", "trace"].forEach(id => {
    const P = PANELS[id]; const p = P.el;
    p.classList.toggle("is-max", P.max && P.state === "open");
    if (P.state === "closed") { p.remove(); return; }
    [["snapl", "left", "arrowLeft"], ["snapr", "right", "arrowRight"]].forEach(([act, side, icn]) => {
      const sb = p.querySelector(`[data-act="${act}"]`), on = P.dock === side && !P.max;
      sb.innerHTML = ic(icn); sb.title = sb.ariaLabel = "Snap " + side; sb.setAttribute("aria-pressed", on); sb.classList.toggle("is-selected", on);
    });
    const mb = p.querySelector('[data-act="max"]');
    mb.innerHTML = ic(P.max ? "restore" : "maximize");
    mb.title = mb.ariaLabel = P.max ? "Restore to dock" : "Expand";
    p.querySelector('[data-act="collapse"]').innerHTML = ic(P.dock === "left" ? "hideLeft" : "hideRight");
    if (P.state === "collapsed") {
      p.remove();
      const t = el("button", "edge-tab", `${ic(P.icon)}<span>${esc(P.title)}</span>`);
      t.title = "Expand " + P.title;
      t.addEventListener("click", () => openPanel(id));
      docks[P.dock].querySelector(".dock__tabs").appendChild(t);
      return;
    }
    if (P.max) { $("#ws").appendChild(p); return; }
    docks[P.dock].querySelector(".dock__stack").appendChild(p);
    widths[P.dock] = Math.max(widths[P.dock], P.width);
  });
  docks.left.style.setProperty("--dock-w", (widths.left || 360) + "px");
  docks.right.style.setProperty("--dock-w", (widths.right || 400) + "px");
  
}
/* drag-to-snap */
function initDrag(p, id) {
  const head = p.querySelector(".panel__head");
  head.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY; let dragging = false, ghost = null, hot = null;
    const zones = $("#snapzones");
    const move = ev => {
      if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
      if (!dragging) {
        dragging = true; p.classList.add("is-dragging"); zones.classList.add("on");
        ghost = el("div", "drag-ghost", `${ic(PANELS[id].icon, "sdl-icon--sm")}${esc(PANELS[id].title)}`); document.body.appendChild(ghost);
      }
      ghost.style.left = ev.clientX + 12 + "px"; ghost.style.top = ev.clientY + 12 + "px";
      const r = $("#ws").getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width, y = ev.clientY - r.top;
      hot = x < 0.26 ? "left" : x > 0.74 ? "right" : (y < 110 ? "max" : null);
      zones.querySelectorAll(".zone").forEach(z => z.classList.toggle("is-hot", z.dataset.z === hot));
    };
    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      if (!dragging) return;
      p.classList.remove("is-dragging"); zones.classList.remove("on"); ghost.remove();
      zones.querySelectorAll(".zone").forEach(z => z.classList.remove("is-hot"));
      if (hot === "max") { Object.keys(PANELS).forEach(k => PANELS[k].max = k === id); PANELS[id].state = "open"; layoutPanels(); }
      else if (hot) snapPanel(id, hot);
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
}

/* ---------- Activity trace ---------- */
const TRACES = [];
const TYPE_ICON = { reasoning: "bulb", retrieval: "search", computation: "fx", generation: "ai", system: "cog", workflow: "wrench", read: "file", summary: "success" };
const TYPE_ALIAS = { approval: "system", human: "system", memory: "system", agent: "workflow" };
const TRACE_WINDOW = 4;
const detailHTML = d => d.replace(/<dl class="sdl-kv">([\s\S]*?)<\/dl>/g, (m, inner) => `<div class="tr-meta">${[...inner.matchAll(/<dt>([\s\S]*?)<\/dt><dd>([\s\S]*?)<\/dd>/g)].map(x => `<div>${x[1]}: ${x[2]}</div>`).join("")}</div>`);
const steps = n => `${n} ${n === 1 ? "step" : "steps"}`;
let tid = 0;
function newTrace(msg, title, pnk) {
  const t = { id: ++tid, pn: pnk, title, running: true, items: [], collapsed: false, host: msg.slot, t0: performance.now(), msg };
  TRACES.push(t); const at = msg.el.querySelector(".sdl-ai-msg__attr"); if (at) { at.classList.add("is-toggle"); at.dataset.toggleTrace = t.id; at.setAttribute("role", "button"); at.setAttribute("tabindex", "0"); } renderTrace(t); return t;
}
function activeTrace() { for (let i = TRACES.length - 1; i >= 0; i--) if (TRACES[i].running) return TRACES[i]; return TRACES[TRACES.length - 1]; }
function activeTraceAdd(it) { const t = activeTrace(); if (t) return traceAdd(t, it); }
function traceAdd(t, it) {
  const item = Object.assign({ id: t.id + "-" + (t.items.length + 1), state: "running", type: "system", actor: "Travel agent", time: clock(), expanded: false }, it);
  t.items.push(item); renderTrace(t); return item;
}
function traceSet(t, item, patch) { Object.assign(item, patch); renderTrace(t); }
function traceFinish(t, title, state = "completed") {
  t.running = false; t.title = title; t.endState = state;
  t.meta = `${steps(t.items.length)} · ${((performance.now() - t.t0) / 1000).toFixed(1)}s · Agent: ${t.msg.agentName}`;
  t.collapsed = t.items.length > 4 && !t.items.some(i => i.type === "approval" || i.type === "human"); renderTrace(t);
}
function itemCat(it) { return it.cat || (it.type === "approval" ? "approval" : ["retrieval", "read", "computation"].includes(it.type) || it.tool ? "tool" : "other"); }
function itemHTML(t, it, panel) {
  /* Activity trace reference: base types (reasoning, retrieval, computation, generation, system action, workflow, read, summary), generic = neutral dot; chevron leads expandable items, detail sits on a vertical line */
  const ty = TYPE_ALIAS[it.type] || it.type;
  const glyph = it.state === "running" ? "" : it.state === "warning" ? ic("warning") : it.state === "failed" ? ic("error") : (TYPE_ICON[ty] ? ic(TYPE_ICON[ty]) : '<i class="tr-dot"></i>');
  const stateName = { completed: "Completed", warning: "Completed with warnings", failed: "Failed", running: "Running" }[it.state];
  const fresh = !it.seen && !panel; if (!panel) it.seen = true;

const pill = (i, n) => `<button class="sdl-source-pill" data-src="${i}">${ic("globe")} ${n}</button>`;
async function tripSteps(t, run, ms) {

function wireSources(m) {
  const tipShow = b => {
    hideTip(); const k = b.dataset.src; if (k === "x") return;
    const r = b.getBoundingClientRect(), host = $("#page-copilot").getBoundingClientRect();
    const tip = el("div", "src-tip", `<div class="f">Source from ${esc(SRC[k][1])}</div><div class="t">${esc(SRC[k][0])}</div><div class="d">${esc(SRC[k][2])}</div>`);
    tip.id = "src-tip"; tip.setAttribute("role", "tooltip");
    tip.style.left = Math.max(8, Math.min(r.left - host.left, host.width - 336)) + "px"; tip.style.top = (r.bottom - host.top + 8) + "px";
    $("#page-copilot").appendChild(tip); b.setAttribute("aria-describedby", "src-tip");
  };
  const hideTip = () => { const x = $("#src-tip"); if (x) x.remove(); };
  m.body.addEventListener("mouseover", e => { const b = e.target.closest("[data-src]"); if (b) tipShow(b); });
  m.body.addEventListener("mouseout", e => { if (e.target.closest("[data-src]")) hideTip(); });
  m.body.addEventListener("focusin", e => { const b = e.target.closest("[data-src]"); if (b) tipShow(b); });
  m.body.addEventListener("focusout", hideTip);
  m.body.addEventListener("click", e => {
    const b = e.target.closest("[data-src]"); if (!b) return;
    m.body.querySelectorAll("[data-src]").forEach(x => x.classList.toggle("is-on", x === b));
    const out = m.body.querySelector(".src-out"), k = b.dataset.src;
    out.innerHTML = k === "x" ? `<p class="sdl-caption">${ic("warning", "sdl-icon--sm")} <b>No source.</b> The entry rules check was unavailable, so this claim is flagged as unverified instead of presented as fact.</p>` : `<div class="source-card"><div class="sh">${esc(SRC[k][0])}<span>${esc(SRC[k][1])}</span></div><q>${esc(SRC[k][2])}</q></div>`;
    scrollChat();
  });
  m.actions(true).querySelector(".sdl-sources").addEventListener("click", ev => openSourcesDrawer(SRC, ev.currentTarget));
}

/* ============================================================

function resetData() { S.mode = "Co-Pilot"; S.memory = DEFAULT_MEMORY(); S.traceFilter = "all"; S.agents = ["travel"]; renderAgentChip(); }
function resetDemo() {
  Tour.stop(); newRun(); clearChat(); resetData(); closePn();
  if (S.traceSnapped) { S.traceSnapped = false; PANELS.trace.state = "closed"; PANELS.trace.max = false; }
  layoutPanels();

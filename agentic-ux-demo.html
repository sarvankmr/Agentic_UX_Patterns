.sdl-prompt-card { background: var(--background-1); border: var(--border-width-default) solid var(--border-3); border-radius: 0.25rem; padding: var(--spacing-50); text-align: left; font: inherit; color: var(--text-primary); cursor: pointer; min-height: 72px; display: flex; flex-direction: column; gap: var(--spacing-20); }
.sdl-prompt-card:hover { background: var(--background-hover); }
.sdl-prompt-card.is-selected { border-color: var(--border-accent); background: var(--background-accent-secondary-hover); }
.sdl-prompt-card__title { font-weight: 600; }
.sdl-prompt-card__text { font-size: 0.875rem; line-height: 1.4285714286; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sdl-prompt-card__meta { display: flex; gap: var(--spacing-40); align-items: center; margin-top: auto; font-size: 0.75rem; color: var(--text-secondary); flex-wrap: wrap; }
.sdl-prompt-card__meta .sdl-right { margin-left: auto; display: flex; gap: var(--spacing-10); }

/* Chat history */
.sdl-history { background: var(--background-1); width: 320px; display: flex; flex-direction: column; gap: var(--spacing-20); padding: var(--spacing-40); }
.sdl-history__title { font-weight: 600; padding: var(--spacing-20) var(--spacing-40); display: flex; align-items: center; }
.sdl-history__title .sdl-icon-btn { margin-left: auto; }
.sdl-history__section { color: var(--text-secondary); font-size: 0.75rem; padding: var(--spacing-40) var(--spacing-40) var(--spacing-20); }
.sdl-history-item { display: flex; align-items: center; gap: var(--spacing-30); padding: var(--spacing-30) var(--spacing-40); border-radius: 0; cursor: pointer; color: var(--text-primary); border-left: var(--border-width-selected) solid transparent; }
.sdl-history-item:hover, .sdl-history-item.is-hover { background: var(--background-hover); }
.sdl-history-item.is-selected { background: var(--background-accent-secondary-hover); border-left-color: var(--text-accent); }
.sdl-history-item__main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sdl-history-item__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sdl-history-item__meta { display: flex; gap: var(--spacing-30); align-items: center; font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; }
.sdl-history-item__meta .sdl-icon { width: 14px; height: 14px; }
.sdl-history-item__actions { display: flex; gap: var(--spacing-10); opacity: 0; }
.sdl-history-item:hover .sdl-history-item__actions, .sdl-history-item.is-hover .sdl-history-item__actions, .sdl-history-item.is-selected .sdl-history-item__actions { opacity: 1; }

/* Model selector trigger */
.sdl-model-trigger { display: inline-flex; align-items: center; gap: var(--spacing-20); height: 2rem; padding: 0 var(--spacing-30) 0 var(--spacing-40); border-radius: 0; background: transparent; border: 0; color: var(--text-primary); font: inherit; cursor: pointer; }
.sdl-model-trigger:hover { background: var(--background-hover); }
.sdl-model-trigger[disabled] { color: var(--text-disabled); cursor: default; }

/* Agent card (configuration center) */
.sdl-agent-card { background: var(--background-1); border: var(--border-width-default) solid var(--border-4); border-radius: 0.25rem; padding: var(--spacing-50); width: 320px; height: 196px; display: flex; flex-direction: column; gap: var(--spacing-30); cursor: pointer; color: var(--text-primary); }
.sdl-agent-card:hover, .sdl-agent-card.is-hover { background: var(--background-hover); }
.sdl-agent-card.is-active { background: var(--background-active); }
.sdl-agent-card.is-focused { outline: var(--focus-ring-width) solid var(--effects-focus); outline-offset: var(--focus-ring-offset); }
.sdl-agent-card__head { display: flex; align-items: center; gap: var(--spacing-30); }
.sdl-agent-card__name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.sdl-agent-card__desc { font-size: 0.875rem; line-height: 1.4285714286; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sdl-agent-card__meta { display: flex; flex-wrap: wrap; gap: var(--spacing-30) var(--spacing-50); font-size: 0.75rem; color: var(--text-secondary); margin-top: auto; }
.sdl-agent-card__meta b { color: var(--text-primary); font-weight: 600; }
.sdl-agent-card__foot { display: flex; gap: var(--spacing-30); align-items: center; }
.sdl-status { display: inline-flex; align-items: center; gap: var(--spacing-20); font-size: 0.75rem; }
.sdl-status::before { content: ""; width: 8px; height: 8px; border-radius: 100px; background: var(--background-neutral); }
.sdl-status--active::before { background: var(--background-success); }
.sdl-status--draft::before { background: var(--background-neutral); }
.sdl-status--inactive::before { background: var(--text-disabled); }
.sdl-status--degraded::before { background: var(--background-warning); }
.sdl-status--error::before { background: var(--background-danger); }

/* Activity trace */
.sdl-trace { display: flex; flex-direction: column; width: 100%; max-width: 720px; }
.sdl-trace__summary { display: flex; align-items: center; gap: var(--spacing-30); padding: var(--spacing-30) 0; cursor: pointer; }
.sdl-trace__summary .sdl-meta { color: var(--text-secondary); font-size: 0.75rem; margin-left: var(--spacing-20); }
.sdl-trace__summary .sdl-chev { margin-left: auto; }
.sdl-trace-item { display: grid; grid-template-columns: 20px 1fr; column-gap: var(--spacing-40); }
.sdl-trace-item__marker { display: flex; flex-direction: column; align-items: center; }
.sdl-trace-item__dot { width: 16px; height: 16px; border-radius: 100px; display: grid; place-items: center; flex: none; margin-top: 2px; border: 2px solid var(--border-2); background: var(--background-0); color: var(--text-secondary); }
.sdl-trace-item--completed .sdl-trace-item__dot { background: var(--background-success); border-color: var(--background-success); color: var(--text-on-success); }
.sdl-trace-item--running .sdl-trace-item__dot { border-color: var(--text-accent); border-top-color: transparent; animation: sdl-spin .9s linear infinite; }
.sdl-trace-item--warning .sdl-trace-item__dot { background: var(--background-caution); border-color: var(--background-caution); color: var(--text-on-caution); }
.sdl-trace-item--failed .sdl-trace-item__dot { background: var(--background-danger); border-color: var(--background-danger); color: var(--text-on-danger); }
.sdl-trace-item__line { width: 2px; flex: 1; background: var(--border-4); min-height: var(--spacing-50); }
.sdl-trace-item:last-child .sdl-trace-item__line { display: none; }
.sdl-trace-item__body { padding-bottom: var(--spacing-50); min-width: 0; }
.sdl-trace-item__label { display: flex; align-items: center; gap: var(--spacing-30); min-height: 20px; }
.sdl-trace-item__label .sdl-icon { width: var(--icon-sm); height: var(--icon-sm); color: var(--text-secondary); }
.sdl-trace-item__label .sdl-chev { margin-left: auto; opacity: 0; }
.sdl-trace-item:hover .sdl-trace-item__label .sdl-chev, .sdl-trace-item.is-expanded .sdl-trace-item__label .sdl-chev { opacity: 1; }
.sdl-trace-item__detail { margin-top: var(--spacing-30); font-size: 0.875rem; line-height: 1.4285714286; color: var(--text-secondary); display: flex; flex-direction: column; gap: var(--spacing-30); }
.sdl-trace-item__detail .sdl-kv { font-size: 0.75rem; }
.sdl-entity { display: inline-flex; align-items: center; gap: var(--spacing-20); padding: 0 var(--spacing-20); border-radius: 2px; background: var(--background-2); color: var(--text-primary); font-family: var(--font-mono); font-size: 0.75rem; }
.sdl-entity--interactive { color: var(--text-accent); cursor: pointer; }
.sdl-entity--interactive:hover { background: var(--background-hover); }
.sdl-entity .sdl-icon { width: 14px; height: 14px; }

/* Approval block (human-in-the-loop) */
.sdl-approval { width: 100%; max-width: 720px; margin: 0 auto; background: var(--background-1); border: var(--border-width-default) solid var(--border-3); border-radius: 0.25rem; padding: var(--spacing-50) var(--spacing-60); display: flex; flex-direction: column; gap: var(--spacing-40); }
.sdl-approval__head { display: flex; align-items: center; gap: var(--spacing-30); font-weight: 600; }
.sdl-approval__head .sdl-icon { color: var(--text-secondary); }
.sdl-approval__rationale { font-size: 0.875rem; line-height: 1.4285714286; color: var(--text-secondary); margin: 0; }
.sdl-approval__risk { display: flex; gap: var(--spacing-30); align-items: flex-start; font-size: 0.75rem; line-height: 1.3333333333; }
.sdl-approval__risk--moderate { color: var(--text-warning); }
.sdl-approval__risk--high { color: var(--text-danger); }
.sdl-approval__actions { display: flex; gap: var(--spacing-40); }
.sdl-approval--resolved { padding: var(--spacing-40) var(--spacing-60); color: var(--text-secondary); }
.sdl-approval--resolved .sdl-approval__head { font-weight: 400; }

/* Feedback modal tags */
.sdl-tags { display: flex; flex-wrap: wrap; gap: var(--spacing-30); }

/* Session header */
.sdl-session-header { display: flex; align-items: center; gap: var(--spacing-20); height: var(--size-100); padding: 0 var(--spacing-50); border-bottom: var(--border-width-default) solid var(--border-4); background: var(--background-1); }
.sdl-session-header__title { display: flex; align-items: center; gap: var(--spacing-20); font-weight: 600; }
.sdl-session-header__spacer { flex: 1; }

/* Errors */
.sdl-error-inline { display: flex; gap: var(--spacing-40); align-items: flex-start; font-size: 0.875rem; line-height: 1.4285714286; }
.sdl-error-inline .sdl-icon { color: var(--text-danger); }

:root{color-scheme:dark}
/* Demo app shell */
/* Agentic UX pattern demo — app-shell layer over the SDL AI UX reference styles (bundle.css + tokens.css, dark theme).
   Layout: app header / app rail (Copilot · Agent Configuration Center) / workspace = [left dock][page][right dock].
   Docks hold snappable panels: Pattern guide, Activity trace, Agent details (configuration). */
html,body{height:100%}
body{overflow:hidden;background:var(--background-0);color:var(--text-primary)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3,h4,h5{margin:0;text-wrap:balance}
p{margin:0}
.sdl-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border:var(--border-width-default) solid transparent;border-radius:0;color:var(--text-primary);flex:none}
.sdl-btn{min-width:0}
.sdl-prompt{min-width:0}
.sdl-message-bar{min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono)}

/* ---------- App header ---------- */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.sdl-app-header{height:var(--size-110);padding-left:max(var(--spacing-60),env(safe-area-inset-left,0px));padding-right:max(var(--spacing-60),env(safe-area-inset-right,0px));border-bottom-color:var(--border-1)}
.brand{font-weight:600;font-size:1.25rem;letter-spacing:.04em;color:var(--text-primary)}
.sdl-app-header__title{font-weight:600;font-size:.875rem}
.hdr-crumb{color:var(--text-secondary);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sdl-avatar-init{width:var(--avatar-xs);height:var(--avatar-xs);border-radius:100px;background:var(--background-3);display:grid;place-items:center;font-size:.75rem;font-weight:600;flex:none}

/* ---------- Body: rail + workspace ---------- */
.body{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:0}
.rail{width:48px;background:var(--background-1);border-right:var(--border-width-default) solid var(--border-4);display:flex;flex-direction:column;padding:var(--spacing-20) 0;transition:width .15s;overflow:hidden}
.rail.is-open{width:248px}
.rail__item{display:flex;align-items:center;gap:var(--spacing-50);height:48px;padding:0 14px;color:var(--text-primary);border-left:var(--border-width-emphasis) solid transparent;white-space:nowrap;text-align:left}
.rail__item:hover{background:var(--background-hover)}
.rail__item.is-selected{border-left-color:var(--text-accent);background:var(--background-accent-secondary-hover);color:var(--text-on-accent-secondary)}
.rail__item span{opacity:0;transition:opacity .1s}
.rail.is-open .rail__item span{opacity:1}
.rail__spacer{flex:1}
.ws{position:relative;display:flex;min-width:0;min-height:0}
.page{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}

/* ---------- Docks & snappable panels ---------- */
.dock{display:flex;min-height:0;flex:none}
.dock--left{order:0;flex-direction:row}
.page-host{order:1;flex:1;min-width:0;display:flex}
.dock--right{order:2;flex-direction:row-reverse}
.dock__stack{display:flex;flex-direction:column;min-height:0;width:var(--dock-w,380px);max-width:44vw}
.dock--left .dock__stack{border-right:var(--border-width-default) solid var(--border-4)}
.dock--right .dock__stack{border-left:var(--border-width-default) solid var(--border-4)}
.dock__tabs{display:flex;flex-direction:column;gap:var(--spacing-20);width:32px;background:var(--background-2);padding:var(--spacing-20) 0;border-left:var(--border-width-default) solid var(--border-4);border-right:var(--border-width-default) solid var(--border-4)}
.dock__tabs:empty,.dock__stack:empty{display:none}
.edge-tab{writing-mode:vertical-rl;display:flex;align-items:center;gap:var(--spacing-30);padding:var(--spacing-50) 0;width:100%;font-size:.75rem;font-weight:600;color:var(--text-secondary)}
.dock--left .edge-tab{transform:rotate(180deg)}
.edge-tab:hover{background:var(--background-hover);color:var(--text-primary)}
.edge-tab .sdl-icon{width:16px;height:16px;transform:rotate(90deg)}
.dock--left .edge-tab .sdl-icon{transform:rotate(-90deg)}
.panel{display:flex;flex-direction:column;flex:1 1 0;min-height:0;background:var(--background-1)}
.panel + .panel{border-top:var(--border-width-default) solid var(--border-4)}
.panel__head{display:flex;align-items:center;gap:var(--spacing-30);height:48px;padding:0 var(--spacing-20) 0 var(--spacing-50);border-bottom:var(--border-width-default) solid var(--border-4);cursor:grab;user-select:none;flex:none}
.panel__head:active{cursor:grabbing}
.panel__title{display:flex;align-items:center;gap:var(--spacing-30);font-weight:600;min-width:0;flex:1}
.panel__title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel__grip{color:var(--text-disabled);display:flex}
.panel__snap{display:flex;gap:0}
.panel__snap .sdl-icon-btn{width:28px;height:28px}
.panel__snap .sdl-icon-btn .sdl-icon{width:16px;height:16px}
.panel__body{flex:1;min-height:0;overflow:auto;position:relative}
.panel.is-max{position:absolute;inset:0;z-index:30;box-shadow:var(--shadow-4)}
.panel.is-max .panel__body .max-wide{max-width:960px;margin:0 auto}
.panel.is-dragging{opacity:.55}
.snapzones{position:absolute;inset:0;z-index:40;pointer-events:none;display:none}
.snapzones.on{display:block}
.zone{position:absolute;top:var(--spacing-40);bottom:var(--spacing-40);border:var(--border-width-selected) dashed var(--border-2);border-radius:0.25rem;display:grid;place-items:center;color:var(--text-secondary);font-size:.75rem;font-weight:600;background:var(--effects-backdrop)}
.zone--left{left:var(--spacing-40);width:22%}
.zone--right{right:var(--spacing-40);width:22%}
.zone--max{left:28%;right:28%;top:var(--spacing-40);bottom:auto;height:72px}
.zone.is-hot{border-color:var(--border-accent);color:var(--text-accent);background:var(--background-accent-secondary-active)}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;background:var(--background-3);box-shadow:var(--shadow-4);border-radius:0.25rem;padding:var(--spacing-30) var(--spacing-50);font-weight:600;display:flex;gap:var(--spacing-30);align-items:center}

/* ---------- Copilot page ---------- */
.chat-scroll{flex:1;min-height:0;overflow:auto;padding:var(--spacing-90) var(--spacing-60) var(--spacing-60);scroll-behavior:smooth}
.sdl-thread{gap:var(--spacing-80)}
.sdl-thread > .sdl-user-msg + .sdl-ai-msg{margin-top:calc(var(--spacing-20) - var(--spacing-80))}
.chat-bottom{padding:var(--spacing-40) var(--spacing-60) var(--spacing-50);display:flex;flex-direction:column;gap:var(--spacing-40);flex:none}
.chat-bottom > *{width:100%;max-width:720px;margin:0 auto}
.sdl-followups:empty,#msgbar:empty,#approvalSlot:empty{display:none}
.sdl-prompt__box.is-locked .sdl-prompt__text{color:var(--text-disabled)}
.sdl-prompt__box.is-locked{opacity:.85}
.sdl-ai-msg__attr .agent-link{color:var(--text-primary);font-weight:600;font-size:.875rem;display:inline-flex;align-items:center;gap:var(--spacing-20)}
.sdl-ai-msg__attr .agent-link:hover{color:var(--text-accent);text-decoration:underline}
.sdl-ai-msg__body > * + *{margin-top:var(--spacing-40)}
.sdl-ai-msg__body p{margin:0}
.ai-tag{display:inline-flex;align-items:center;gap:var(--spacing-20);font-size:.75rem;color:var(--text-secondary)}
.ai-tag .sdl-icon{width:14px;height:14px;color:var(--text-accent)}

.sdl-welcome{padding-top:var(--spacing-80)}
.sdl-key-visual--dark{display:block}.sdl-key-visual--light{display:none}
.wf-card .sdl-prompt-card__title{display:flex;gap:var(--spacing-30);align-items:center}
.wf-card .sdl-prompt-card__title .sdl-icon{width:16px;height:16px;color:var(--text-accent)}

/* Trace inside messages */
.trace-wrap{padding:0}
.sdl-trace__summary .sdl-icon-btn{width:28px;height:28px}
.sdl-trace__summary .sdl-icon-btn .sdl-icon{width:16px;height:16px}
.sdl-trace__summary .sdl-chev{margin-left:0}
.sdl-trace__summary .grow{flex:1}
.trace-items{padding-top:var(--spacing-30)}
.trace-wrap.is-collapsed .trace-items{display:none}
.sdl-trace-item__label{cursor:pointer}
.sdl-trace-item__label .meta{color:var(--text-secondary);font-size:.75rem;margin-left:auto;white-space:nowrap;font-family:var(--font-mono)}
.sdl-trace-item__label .meta + .sdl-chev{margin-left:var(--spacing-30)}
.sdl-trace-item__detail{display:none}
.sdl-trace-item.is-expanded .sdl-trace-item__detail{display:flex}
.sdl-trace-item--running .sdl-trace-item__label > span{color:var(--text-primary)}
.trace-actor{font-size:.75rem;font-weight:600;color:var(--text-secondary);margin-right:var(--spacing-20)}
.snapped-note{display:flex;align-items:center;gap:var(--spacing-30);padding:var(--spacing-30) var(--spacing-50);border:var(--border-width-default) dashed var(--border-3);border-radius:0.25rem;font-size:.75rem;color:var(--text-secondary)}
.snapped-note .sdl-btn{margin-left:auto}
.trace-filters{display:flex;flex-wrap:wrap;gap:var(--spacing-30);padding:var(--spacing-50) var(--spacing-50) var(--spacing-30);align-items:center}
.trace-filters .sdl-filter-chip{height:24px;font-size:.75rem;padding:0 var(--spacing-40)}
.trace-panel{padding:0 var(--spacing-50) var(--spacing-60);display:flex;flex-direction:column;gap:var(--spacing-50)}
.trace-panel .trace-wrap{border-color:var(--border-4)}
.trace-panel .trace-group-label{font-size:.75rem;color:var(--text-secondary);margin-bottom:calc(-1 * var(--spacing-30))}
.panel-empty{padding:var(--spacing-80) var(--spacing-60);text-align:center;color:var(--text-secondary);font-size:.875rem;line-height:1.43}

/* Cards used inside AI messages */
.box{background:var(--background-0);border:var(--border-width-default) solid var(--border-2);border-radius:0.25rem;padding:var(--spacing-50) var(--spacing-60);display:flex;flex-direction:column;gap:var(--spacing-40)}
.box__head{display:flex;align-items:center;gap:var(--spacing-30);font-weight:600;flex-wrap:wrap}
.box__head .sdl-pill,.box__head .sdl-status{margin-left:auto}
.box .sdl-kv{font-size:.875rem}
.row-actions{display:flex;gap:var(--spacing-40);flex-wrap:wrap;align-items:center}
.row-actions .left{margin-right:auto;font-size:.75rem;color:var(--text-secondary)}
.q{display:flex;flex-direction:column;gap:var(--spacing-30)}
.q__label{font-size:.875rem;display:flex;gap:var(--spacing-30);align-items:center;flex-wrap:wrap}
.q__why{font-size:.75rem;color:var(--text-secondary)}
.chips{display:flex;flex-wrap:wrap;gap:var(--spacing-30)}

.plan{display:flex;flex-direction:column;gap:var(--spacing-20)}
.plan-step{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:var(--spacing-40);align-items:center;padding:var(--spacing-30) var(--spacing-40);background:var(--background-2);border-radius:var(--radius-sm)}
.plan-step .n{width:22px;height:22px;border-radius:100px;border:2px solid var(--border-3);display:grid;place-items:center;font-size:.75rem;color:var(--text-secondary)}
.plan-step.is-gated .n{border-color:var(--background-warning);color:var(--text-warning)}
.plan-step.is-off{opacity:.45}.plan-step.is-off .t{text-decoration:line-through}
.plan-step .t{font-size:.875rem;line-height:1.35}
.plan-step .t small{display:block;color:var(--text-secondary);font-size:.75rem}
.assume{display:flex;gap:var(--spacing-40);align-items:flex-start;padding:var(--spacing-40) var(--spacing-50);background:var(--background-2);border-radius:var(--radius-sm)}



.assume .txt{flex:1;min-width:0;font-size:.875rem;line-height:1.4}
.assume .src{font-size:.75rem;color:var(--text-secondary);margin-top:2px}
.assume .act{display:flex;gap:var(--spacing-20);flex:none}
.meter{height:6px;border-radius:100px;background:var(--background-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .7s;border-radius:100px}
.meter.high i{background:var(--background-success)}.meter.low i{background:var(--background-warning)}
.factors{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--spacing-20);font-size:.875rem;color:var(--text-secondary)}
.factors li{display:flex;gap:var(--spacing-30);align-items:flex-start;line-height:1.4}
.factors .sdl-icon{width:16px;height:16px;flex:none;margin-top:1px}

<body>
<div class="app">
  <header class="sdl-app-header">
    <span class="brand" aria-label="Siemens">SIEMENS</span>
    <span class="sdl-app-header__title">Travel Copilot</span>
    <span class="hdr-crumb" id="hdr-crumb">Agentic UX pattern demo</span>
    <span class="sdl-app-header__spacer"></span>
    <button class="sdl-icon-btn" id="hdr-guide" aria-label="Pattern guide" title="Pattern guide"></button>
    <span class="sdl-avatar-init" title="Anita Rao">AR</span>
  </header>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Application menu">
      <button class="rail__item" id="rail-toggle" aria-label="Expand menu" title="Expand menu" aria-expanded="false"><i data-ic="dblRight"></i><span>Collapse menu</span></button>
      <button class="rail__item is-selected" data-page="copilot" title="Copilot"><i data-ic="ai"></i><span>Copilot</span></button>
      <button class="rail__item" data-page="agents" title="Agent Configuration Center"><i data-ic="cog"></i><span>Agent Configuration Center</span></button>
      <span class="rail__spacer"></span>
      <button class="rail__item" id="rail-guide" title="Pattern guide"><i data-ic="info"></i><span>Pattern guide</span></button>
    </nav>

    <div class="ws" id="ws">
      <div class="dock dock--left" id="dock-left"><div class="dock__tabs"></div><div class="dock__stack"></div></div>

      <div class="page-host">
        <!-- Copilot (standalone) -->
        <section class="page" id="page-copilot" aria-label="Copilot">
          <div class="chat-scroll" id="chat-scroll"><div class="sdl-thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div></div>
          <div class="chat-bottom">
            <div class="sdl-followups" id="followups"></div>
            <div id="msgbar" role="alert"></div>
            <div id="approvalSlot" aria-live="assertive"></div>
            <div class="sdl-prompt">
              <form class="sdl-prompt__box" id="prompt">
                <textarea class="sdl-prompt__text" id="prompt-text" rows="1" placeholder="Enter a command, question or topic…" aria-label="Message Travel Copilot" title="Enter your query and select Send"></textarea>
                <div class="sdl-prompt__row">
                  <div class="sdl-prompt__left"><button type="button" class="sdl-icon-btn" id="prompt-add" aria-label="Add" title="Add"><i data-ic="add"></i></button><span id="agent-chip-host"></span></div>
                  <div class="sdl-prompt__right">
                    <button type="button" class="sdl-icon-btn sdl-icon-btn--oval" id="mic" aria-label="Start recording" title="Start recording"><i data-ic="mic"></i></button>
                    <button type="submit" class="sdl-icon-btn sdl-prompt__send" id="send" aria-label="Send" title="Send" disabled><i data-ic="send"></i></button>
                  </div>
                </div>
              </form>
              <div class="sdl-ai-disclaimer">This content is AI-generated. Always verify the information for accuracy.</div>
            </div>
          </div>
        </section>

        <!-- Agent Configuration Center (main navigation) -->
        <section class="page" id="page-agents" aria-label="Agent Configuration Center" hidden>
          <div class="acc">
            <div class="acc__head"><h1>Agent Configuration Center</h1><button class="sdl-btn sdl-btn--outline-primary" id="create-agent"><i data-ic="add"></i> Create agent</button></div>
            <div class="acc__tools">
              <label class="sdl-input"><i data-ic="search" data-cls="sdl-icon--sm"></i><input id="agent-filter" placeholder="Filter agents" aria-label="Filter agents"></label>
              <div class="right">
                <button class="sort-btn" id="sort-btn">Sort by: <span id="sort-label">Name A–Z</span> <i data-ic="chevDown" data-cls="sdl-icon--sm"></i></button>
                <div class="view-toggle" role="group" aria-label="View">
                  <button class="sdl-icon-btn is-selected" data-view="card" aria-label="Card view" title="Card view"><i data-ic="grid"></i></button>
                  <button class="sdl-icon-btn" data-view="list" aria-label="List view" title="List view"><i data-ic="list"></i></button>
                </div>
              </div>
            </div>
            <div id="agent-collection"></div>
          </div>
        </section>
      </div>

      <div class="dock dock--right" id="dock-right"><div class="dock__tabs"></div><div class="dock__stack"></div></div>

      <div class="snapzones" id="snapzones">
        <div class="zone zone--left" data-z="left">Snap left</div>
        <div class="zone zone--max" data-z="max">Expand</div>
        <div class="zone zone--right" data-z="right">Snap right</div>
      </div>
    </div>
  </div>
</div>
<div class="toast-host" id="toasts" aria-live="polite"></div>

<script>window.__PATTERN_LIB__=[{"id": "1.1", "name": "Agent Identity & Role Contract", "tagline": "An explicit, always-available role contract that tells users who the AI agent is, what it can and can't do, and what it has access to, so expectations, safety, and trust stay aligned.", "overview": "Agentic AI acts (editing records, sending messages, orchestrating workflows) and users rapidly form mental models, even relationships, with agents, so misunderstandings about what an agent is and can do are a central source of mistrust. The pattern makes that relationship explicit by bundling identity, capabilities, limits, connected data and tools, and oversight into a persistent agent header plus a deeper Role & Access panel.", "problem": ["Misaligned expectations: users import assumptions from marketing or anthropomorphic cues; when violated, trust erodes quickly.", "Unclear data and tool access: without visible systems and scopes, users may overshare or approve high-risk actions.", "Ambiguous accountability: unclear whether the agent is suggesting or executing leads to over-trust or under-trust."], "useWhen": ["The agent can act on the user's behalf: updating CRM records, creating tickets, sending emails, triggering automations.", "The agent touches production or regulated data: customer PII, financial transactions, HR records, security configs.", "The agent appears in multiple surfaces, its powers change over time, or governance and auditability matter."], "overkillWhen": ["The AI is a narrow, obvious feature (ranking, smart filters, 'improve writing'), not a 'teammate' or agent.", "The feature is read-only and low-risk ('summarize this article', 'suggest tags') or an internal prototype."], "anatomy": [{"label": "Agent header / card", "desc": "Pinned atop chat or side panel: name, avatar distinct from humans, short role tagline, 'Role & access' link."}, {"label": "Inline agent chips", "desc": "Where the agent proposes actions ('Let AI plan this sprint'); hover or click reveals contract snippets."}, {"label": "Permissions surfaces", "desc": "Toasts, banners, modals with contract-derived statements: 'This agent can update lead fields but cannot delete records.'"}, {"label": "Org settings", "desc": "Admin pages listing all agents with a compact version of each contract and controls to adjust scopes or deactivate."}, {"label": "Role contract section", "desc": "Self-contained, testable statements: Who I am, What I can do, What I will not do, Connected tools, Approvals & oversight."}, {"label": "Controls & metadata", "desc": "Risk level (Draft-only / Requires approval / Can execute), status, ownership, environment, 'Request more access', 'View audit log'."}], "lifecycle": ["Initial introduction: intro card with name, avatar, one-line role, and 'Trusted for' / 'Will not do' lists.", "Permission grant: dialog lists each system and exact operations; high-risk scopes called out; contract generated from scopes.", "Normal operation: header stays visible, panel always reachable, agent messages refer back to the contract.", "Boundary handling: state the limitation clearly and offer a safe alternative.", "Capability changes: update the contract and show a diff banner; high-risk changes may require confirmation.", "Incident, audit and revocation: panel exposes recent actions and audit log; revoked scopes update header and copy."], "microcopy": ["I'm an AI agent that helps clean CRM data and propose SDR cadences.", "I can't: approve contracts or modify billing settings.", "Connected to: Salesforce (read/write), Outreach (draft-only), HubSpot (read-only).", "Draft-only · All changes require your approval"], "antiPatterns": [{"dont": "Mystery Agent: just an 'Ask AI' button with no name, role, or visible permissions that sometimes edits data or sends messages.", "do": "Always provide a clear identity, role description, and accessible permissions view."}, {"dont": "Masquerading as Human: the agent presents itself as a human representative and users discover the deception later.", "do": "Always disclose that it is AI from the first interaction."}, {"dont": "Hand-Wavy Disclaimers: tiny footnotes like 'AI may be inaccurate' instead of clear, actionable limits.", "do": "Make statements specific and testable; describe actual boundaries, not vague warnings."}, {"dont": "Cute Persona for Serious Power: highly anthropomorphic mascots in systems that move money or affect employment.", "do": "Personality is fine as a thin layer; underneath keep a crisp, factual description of powers and limits."}], "a11y": ["Communicate risk with consistent, non-alarming text tags ('Draft', 'Needs approval', 'Executes changes') rather than red-alert aesthetics."], "demoSummary": "A B2B sales chat with a Revenue Ops Agent header and a Role & access sidebar listing who it is, what it can and will not do, and connected systems (Salesforce, Outreach, HubSpot) under a 'Draft-only' badge."}, {"id": "1.2", "name": "Delegation Modes (Advisor → Co-Pilot → Autopilot)", "tagline": "Expose clear, named levels of AI autonomy so users can decide how much control to delegate, from suggestions only, to draft-and-confirm, to fully automated execution within guardrails.", "overview": "Delegation Modes make an agent's level of autonomy explicit with three named options instead of a vague 'smart automation' toggle: Advisor (read-only suggestions), Co-Pilot (drafts that need human approval), and Autopilot (executes within guardrails with monitoring and logs). This provides a shared language for who is in charge, reduces anxiety, and lets organizations build trust and adopt automation gradually without losing oversight.", "problem": ["Autonomy is ambiguous and unsettling: 'assistants' and 'co-pilots' hide whether they can send, update, or move money on their own.", "All-or-nothing workflows: approval for every micro-step, or fully automatic behavior with surprises; no way to tune speed vs control.", "Organizations cannot scale trust systematically: different domains need different control, but there is no structured autonomy model."], "useWhen": ["Agents can take real, potentially irreversible actions: sending emails, updating records, deploying code, moving money.", "The same workflow has low- and high-risk variants, e.g. standard replies vs VIP accounts, small vs large transactions.", "Trust is expected to evolve over time, or regulated domains require human approval points and auditable logs."], "overkillWhen": ["The agent is purely read-only or exploratory: document Q&A, analytics summaries, search assistants that never write.", "The UI already forces confirmation on every low-impact action, or outputs are trivial and fully reversible."], "anatomy": [{"label": "Mode selector in settings", "desc": "A 'Delegation mode' control (radio group, segmented control, or dropdown) in agent, workflow, or integration settings."}, {"label": "Inline near execution", "desc": "'Mode: Advisor ▾' next to a 'Run agent' button, or a header chip such as 'Co-Pilot • Needs approval'."}, {"label": "Contextual suggestions", "desc": "Banners or toasts from observed behavior: 'Many similar actions were approved. Consider switching to Autopilot.'"}, {"label": "Per-task override", "desc": "Run a specific job at a different mode than the default: 'Run once in Advisor mode', 'For low-risk tickets only, use Autopilot'."}, {"label": "Mode configuration", "desc": "Label, descriptor and behavior statement per mode, bound to a scope (agent, workflow, inbox, dataset, environment)."}, {"label": "Controls & metadata", "desc": "'View guardrails', 'Pause Autopilot', 'Downgrade to Co-Pilot'; scope, status, owner, and last change for auditability."}], "lifecycle": ["Initial state: default to Advisor (lowest risk) with a short explainer that nothing is changed automatically.", "Upgrade to Co-Pilot as teams repeatedly approve similar actions; humans still approve every change, often in batches.", "Task-level overrides: the effective mode for the current run is clearly indicated when it differs from the default.", "Autopilot activation requires explicit confirmation summarizing scope of impact, guardrails, and rollback options.", "Run-time: Advisor suggests, Co-Pilot queues drafts for review, Autopilot executes, logs everything, and escalates edge cases.", "Exceptions and evolution: auto-pause after repeated issues; analytics recommend upgrades or downgrades; admins set global policies."], "microcopy": ["Advisor: All outputs are suggestions; nothing is applied automatically.", "Co-Pilot: Actions are drafted and must be approved before they go live.", "Approve & send — Nothing is sent until you approve.", "Autopilot paused after several reverted actions. Review and adjust settings."], "antiPatterns": [{"dont": "Hidden Autopilot Behavior: Autopilot is active but the UI doesn't clearly communicate it.", "do": "Always show the current mode prominently with persistent indicators like badges or chips."}, {"dont": "Vague or Marketing Names: labels like 'Smart mode' or 'Turbo AI' that don't communicate capabilities.", "do": "Use descriptive names that communicate behavior: 'Suggestions only', 'Drafts with approval', 'Auto-execute'."}, {"dont": "Silent Auto-Upgrades: migrating configurations to higher autonomy as part of a release without consent.", "do": "Any change that increases autonomy requires explicit user confirmation, not just notification."}, {"dont": "Irreversible Actions Without Guardrails: Autopilot deletes data, sends bulk campaigns, or transfers funds with no limits.", "do": "Define clear guardrails, require confirmations for high-risk operations, and ensure reversibility where possible."}], "a11y": [], "demoSummary": "Three panels show the same expired-password-reset support ticket handled by agent 'Atlas' in Advisor (suggested reply to insert), Co-Pilot (draft queued for 'Approve & send'), and Autopilot (email sent and ticket resolved automatically, with a change log)."}, {"id": "2.2", "name": "Wayfinders (Capability Discovery)", "tagline": "On-screen prompts and affordances that reveal what an AI agent can do in the current context, turning blank states into clear, actionable starting points.", "overview": "Wayfinders surface an agent's capabilities concretely and contextually where an assistant is present but no task has started: empty states, first-run experiences, newly connected integrations, idle side panels. Suggested actions, starter prompts, and capability chips grounded in real data replace the blank prompt, reducing guesswork, aligning expectations, and accelerating time-to-value.", "problem": ["Unclear mental model: users over-trust ('it can do everything') or under-trust ('it probably cannot help') the agent's scope.", "Cognitive load: blank prompts force users to invent tasks, phrase them correctly, and infer what data the agent can use.", "Misaligned expectations: unsupported tasks get weak or blocked responses, so users conclude the system is unreliable or 'dumb'."], "useWhen": ["Introducing an AI assistant into an existing product, or in first-run and early-session experiences.", "After key configuration events: data sources connected, permissions granted, integrations enabled.", "Spaces that appear empty (no chats, results, workflows) or broad capabilities that need guidance to prevent misuse or overwhelm."], "overkillWhen": ["The AI feature has a narrow, deterministic scope already described by a single labeled control ('Auto-format this table').", "The task is high-frequency and well-learned, or the AI is a single embedded function (e.g. autocompleting a form field)."], "anatomy": [{"label": "AI panel / empty state", "desc": "Sidebar or assistant panel empty state (first open in a module) showing high-value suggestions as chips or cards."}, {"label": "Inline prompts", "desc": "Chips in empty search results, empty tables, report pages, document viewers, or a hint row atop a composer."}, {"label": "Event-triggered", "desc": "Banners or toasts after configuration events: 'Jira connected – try: Summarize sprint progress'."}, {"label": "Wayfinder suggestion", "desc": "Outcome-oriented label ('Find blocked tickets') plus a line on what the agent will do and which data it uses."}, {"label": "Controls", "desc": "Click to insert or execute; 'Edit prompt'; 'More like this'; 'Hide / Not relevant' to train future suggestions."}, {"label": "Optional metadata", "desc": "Scope indicators, safety cues ('Preview only'), status tags ('New', 'Recommended', 'Advanced'), usage signals."}], "lifecycle": ["Initial state: a small set of high-value, low-risk suggestions grounded in default or globally available data.", "Contextual adaptation: suggestions update as users select records, filter views, open documents, or upload files.", "Insertion and execution: insert an editable prompt with interpolated context, or run directly; risky actions get a visible review step.", "Feedback loop: learn from prompt edits, suppress dismissed suggestions, promote frequent ones to 'Recommended'.", "Progressive personalization by role, usage history, and data access; used suggestions decay and fade during active chat.", "Errors: explain why a suggestion can't run and offer a next step ('Connect Jira', 'Request access to Salesforce')."], "microcopy": ["Summarize this quarter's at-risk deals", "Uses Zendesk tickets from last 7 days", "Based on 5 visible accounts + CRM data", "Preview impact before applying changes"], "antiPatterns": [{"dont": "Over-Promising Capabilities: suggestions like 'Fix all bugs in this codebase' that the agent cannot reliably perform.", "do": "Only surface capabilities that work consistently with production data."}, {"dont": "Ignoring Data Boundaries: suggestions reference data sources or scopes the user does not have access to.", "do": "Scope suggestions to data the user can actually access and act upon."}, {"dont": "Clutter & Cognitive Overload: too many suggestions or dissimilar tasks in the same cluster.", "do": "Limit to 3–5 high-value suggestions with clear grouping and progressive disclosure."}, {"dont": "Opaque Behavior: suggestions trigger complex flows without explaining what will happen or which data is used.", "do": "Always show what data will be used and what action will be taken before execution."}], "a11y": ["Chips and cards must be keyboard-navigable with clear focus states; accessible labels include action and data scope; announce execution.", "Don't rely on color alone for 'New' / 'Recommended' / 'Advanced' tags; keep motion subtle and respect reduced-motion preferences."], "demoSummary": "A CRM accounts table with an AI Assistant sidebar whose suggestions ('Identify at-risk accounts', 'Draft Q4 summary report', 'Find upsell opportunities') update as you select account rows."}, {"id": "3.2", "name": "Human-in-the-Loop (HITL) Gates", "tagline": "A pattern that pauses AI-driven actions at defined checkpoints so humans can review, edit, and approve high-impact steps before execution, maintaining safety, accountability, and trust.", "overview": "HITL Gates introduce explicit checkpoints where an agent must obtain human approval before performing a real-world action such as sending email, pushing code, moving money, or modifying production data. They appear as inline chat requests, approval cards or modals, dedicated Approvals views, and notifications, giving predictable, explainable control with auditable approval flows.", "problem": ["Unpredictable automation: external actions feel sudden; users never know when 'suggest' crosses the line into 'do'.", "High-stakes, irreversible consequences and governance gaps: no maker-checker or multi-party sign-off for risky actions.", "Limited accountability and cognitive overload: who approved this? Users feel compelled to hover and re-check everything."], "useWhen": ["AI agents perform actions affecting external systems: CRMs, payment processors, infrastructure, HR tools, customer channels.", "Actions are high-impact or irreversible: finance, legal, security, healthcare, deleting data, rolling back production.", "Policy or regulation requires approvals or segregation of duties (SOX, GDPR, HIPAA), or early adoption when trust matters most."], "overkillWhen": ["The AI is read-only or advisory, or actions are low-stakes and easily reversible (private drafts, a personal dashboard).", "A simple confirmation pattern ('Undo' snackbars, lightweight dialogs) already suffices and no external systems are at risk."], "anatomy": [{"label": "In-flow within chat", "desc": "Inline gate message with an embedded card: 'Approval required: Send this campaign to 142 recipients.'"}, {"label": "Dedicated approvals page", "desc": "'Approvals' or 'Review queue' listing all open gate requests with triage and filtering by risk, type, requester."}, {"label": "System notifications", "desc": "Email, push, Slack or Teams alerts with deep links back to the specific gate for asynchronous approvals."}, {"label": "Admin & policy settings", "desc": "Security owners and admins define which actions must be gated, who can approve, and what defaults apply."}, {"label": "Gate Request", "desc": "Proposed action label, risk/policy statement, and controls: Approve, Reject, Edit, Save as draft, Escalate."}, {"label": "Optional metadata", "desc": "Actor, target systems, risk indicators, triggering policy, timing/expiration, and prior approval history."}], "lifecycle": ["Action identification: a risk engine evaluates the planned action; if it meets gating criteria, a Gate Request is created.", "Gate creation and pause: action goes pending; intent, inputs, effects and policies recorded; agent says progress is blocked.", "Notification and surfacing: inline summary card in chat plus alerts to approvers; time-sensitive items marked urgent.", "Review: approver inspects previews (email body, SQL, config diffs), before/after comparisons, simulated effects.", "Decision: approve once, approve with edits, reject with optional feedback, or escalate to another role.", "Execution or cancellation, then audit logging; system may propose auto-approval for consistently approved low-risk actions."], "microcopy": ["Approval required to send 5 emails to 142 customers (external recipients).", "Pending until 17:00 UTC; will cancel if not approved", "Approved – Executed at [time] / Expired – Action canceled; draft retained", "Blocked by policy 'PII export rules'. Contact Data Governance for assistance."], "antiPatterns": [{"dont": "Gating Everything: every action requires approval regardless of risk, causing fatigue and rubber-stamping.", "do": "Gate based on actual risk assessment; auto-approve low-risk, routine actions."}, {"dont": "Hidden Risk Context: a gate appears with just an 'Approve' button and no explanation.", "do": "Always show what action is being taken, why it's gated, and what the impact will be."}, {"dont": "Pressure to Approve: copy or layout subtly pushes approvers toward accepting high-risk actions.", "do": "Give approve and reject equal visual weight; make rejection easy and judgment-free."}, {"dont": "Auto-Approving High-Risk: 'always approve' allowed for dangerous actions, with no way to review or revoke it.", "do": "High-risk actions are always gated by policy; auto-approve only low-risk, reversible actions and provide a revocation surface."}], "a11y": ["Fully keyboard navigable with visible focus; semantic markup and ARIA roles; descriptive labels like 'Approve this deployment'.", "Don't rely on color alone for risk; pair with text labels and icons; short sentences; mobile shows summaries first, details on demand."], "demoSummary": "An AI marketing agent drafts a launch email to 2,405 leads and pauses at a PENDING Action Request card (action, recipients, risk level, preview) with Edit, Reject, and Approve & Send buttons."}, {"id": "3.3", "name": "Plan-then-Execute Workflow (Unified Stream Variant)", "tagline": "A conversational workflow where multiple AI agents operate within a single, unified chat stream; agents propose explicit, editable plans for multi-step or risky tasks, while a navigation-based Action Shelf ensures pending requests don't get lost in the scroll history.", "overview": "Instead of acting immediately, an agent surfaces a structured plan in the chat, invites refinement, and only then executes. In a unified stream where DevOps, CRM, and Data agents talk at once, a navigation-only Action Shelf above the input lists pending plans and jumps the user to the inline plan card, while approve, edit, and reject controls stay attached to the card itself.", "problem": ["Hidden intent and side effects: the agent takes a natural-language request and immediately performs tool calls or data mutations.", "Action requests get buried: plan cards scroll off-screen as other agents post, so users don't know work is blocked on them.", "Fragmented control: users forget which agent is waiting on them; duplicating approve buttons in a global header is dangerous."], "useWhen": ["Multi-step or orchestrated workflows involving several steps, tools, or dependencies (analyze → draft → review → apply).", "Risky or irreversible actions with write access to production, finance, customer communications, or compliance data.", "Ambiguous open-ended requests ('clean up our data'), cross-system operations, or human-in-the-loop requirements."], "overkillWhen": ["Simple, low-risk queries (direct Q&A, summarization, non-destructive retrieval) or highly scoped single-step actions.", "The UI already constrains the action tightly via forms, wizards, or configuration screens that preview changes."], "anatomy": [{"label": "Inline Plan Card", "desc": "Rendered in the proposing agent's message: step-by-step breakdown, risk and impact assessment, affected entities."}, {"label": "Plan card controls", "desc": "'Approve', 'Edit', 'Reject' live on the card so the user reads the plan first; optional dry-run or environment selection."}, {"label": "Plan metadata", "desc": "plan_id, agent_id / agent_name, conversation_id, environment (sandbox, staging, production), risk_level."}, {"label": "Navigation Action Shelf", "desc": "Compact, non-modal bar above the input, visible for any agent; summary like '2 Actions Pending'; collapsible."}, {"label": "Navigation chips", "desc": "One per pending action: agent avatar + name, short label ('Prod DB Scaling'), status text, risk/env tag, jump icon."}, {"label": "Click behavior", "desc": "Smooth-scrolls to center the target message, which briefly highlights (1–2 s fade) to orient the user."}], "lifecycle": ["Proposal: agent posts an inline Plan Card with steps, risks and controls; writes are paused; shelf slides up with a chip.", "Context switching: another agent's messages push the plan off-screen; the shelf keeps showing '1 Action Pending'.", "Navigation and review: click the chip to scroll to the card; answer clarifications inline; chip state updates (Needs info → Needs approval).", "Execution: user clicks Approve on the card itself; plan moves waiting_approval → running; progress posts in the stream.", "Cleanup: chip removed once no input is needed; shelf hides when nothing is pending; chip reappears if execution blocks mid-way.", "Plan states: draft → in review → awaiting approval → executing → paused → completed or canceled with a summary."], "microcopy": ["2 Actions Pending / Prod DB Scaling – Needs approval", "Approve this plan to start execution.", "Not ready? Edit the plan or cancel.", "High impact: This step will update live records. / Environment: Live"], "antiPatterns": [{"dont": "Silent Execution After Showing a Plan: displaying a plan and then immediately executing without explicit approval.", "do": "Always require explicit approval before execution begins."}, {"dont": "Overly Verbose, Unreadable Plans: dozens of poorly grouped steps or heavy technical detail that invite blind approval.", "do": "Group steps logically, use progressive disclosure, and prioritize scanability."}, {"dont": "Hidden Risk or Environment: burying the sandbox vs live distinction or downplaying high-risk steps.", "do": "Surface environment and risk prominently on every step."}, {"dont": "Forcing Planning for Trivial Tasks: requiring a plan for every small action habituates users to approve without reading.", "do": "Reserve planning for complex or risky tasks; allow direct execution for simple, safe actions."}], "a11y": ["Pair color cues with text labels and icons for state ('Live data', 'High impact'); provide a reduced-motion mode for scroll highlights.", "Keyboard users must be able to focus each shelf chip, activate the jump, and move between chips and the input efficiently."], "demoSummary": "A unified chat with DevOps and CRM assistants where sending 'Scale production DB and clean outdated leads' yields inline plan cards and an Action Shelf of pending plans that clears when a plan is approved in the chat."}, {"id": "4.1", "name": "Structured Clarification Prompts", "tagline": "A pattern for agentic AI systems to ask a small set of targeted, structured questions before acting, resolving ambiguity while keeping interactions fast and trustworthy.", "overview": "Structured Clarification Prompts are short, focused question sets an agent surfaces when a request is underspecified or risky, presented as a compact panel of mostly multiple-choice fields with sensible defaults and a clear 'other/custom' option. The core idea is to ask the minimum number of high-value questions, in a structured format, only when needed, which reduces error cascades and rework and supports auditability.", "problem": ["Silent assumption: the agent guesses missing details and proceeds, risking production issues or irrecoverable changes.", "Interrogation mode: long chains of generic open-ended questions ('Can you clarify?') raise cognitive load and cause abandonment.", "Fragmented clarification: questions scattered across the conversation, answers not reused, the same thing asked again."], "useWhen": ["High-impact or irreversible actions: data deletions, production deployments, financial operations, permission changes, bulk updates.", "Underspecified, high-variance requests ('campaign for existing customers') or multi-agent workflows where gaps cascade.", "Compliance, audit or governance needs, or reasonably stable user preferences (environment, budget ceilings, channels)."], "overkillWhen": ["The interaction is low-stakes and reversible: brainstorming, drafting non-critical copy, summarizing a document.", "A traditional form already captures everything, missing details are trivial or inferable, or the use case is purely exploratory."], "anatomy": [{"label": "Pre-action checkpoint", "desc": "After intent detection but before tools, commits or spend: 'Before continuing, 3 details require confirmation.'"}, {"label": "Mid-run pause", "desc": "A long-running automation pauses at a risky or ambiguous step (choosing environments, resolving conflicting records)."}, {"label": "Inline follow-up", "desc": "A small question card embedded in a response for localized uncertainty: 'Which departments should this apply to?'"}, {"label": "Preference templates", "desc": "Defaults set upfront for repeated tasks; clarifications only asked when deviations or unusual conditions arise."}, {"label": "Clarification Question", "desc": "Label plus one-line 'why it matters'; radio/segmented/dropdown, checkboxes, numeric or slider, and 'Other / custom…'."}, {"label": "Metadata", "desc": "Criticality (required/optional), scope tags ('Production impact', 'Billing'), pre-filled defaults, persistence options."}], "lifecycle": ["Intent and ambiguity detection: a layer flags missing, conflicting or uncertain fields and categorizes them by impact.", "Selective clarification: high-impact unknowns trigger questions; low-impact ones use inference or safe defaults; budget of 3–5.", "Question bundling: overlapping questions from multiple tools or agents are merged and ordered by importance.", "Structured panel: required/optional markers, pre-filled defaults, progress indicator for longer sets.", "User answers with inline validation and a summary row; agent shows values in a pre-execution summary, user confirms, agent acts.", "Preference persistence ('Remember this for next time') and structured logging for audit and improving when-to-ask models."], "microcopy": ["Before continuing, 3 details require confirmation.", "Running in production may affect live customers; staging is safe for testing.", "Other / custom…", "Confirm & Deploy / Save as my default"], "antiPatterns": [{"dont": "Endless Interrogation: dozens of questions across multiple messages with no clear grouping.", "do": "Bundle related questions, limit to 3–5 at a time, and show progress indicators."}, {"dont": "Blocking on Trivial Details: asking about email tone or formatting before doing anything useful.", "do": "Reserve blocking clarifications for high-impact decisions; use sensible defaults for stylistic choices."}, {"dont": "Duplicate Questions in One Session: asking again because the earlier answer was not stored or reused.", "do": "Persist answers within the session and offer preference saving for cross-session reuse."}, {"dont": "Hidden Assumptions: inferring critical values and never showing them in a summary or confirmation step.", "do": "Always show inferred values in a pre-execution summary and let users inspect and change them."}], "a11y": ["Keep labels concise and avoid jargon; ensure full keyboard navigation and screen-reader-friendly grouping.", "Break up dense explanation text with short paragraphs or expandable 'Learn more' links."], "demoSummary": "A DevOps agent asked to promote the payments-service build pauses with a 'Deployment Configuration' form (Staging vs Production, 10% canary vs 100% traffic, Slack or email notify) before 'Confirm & Deploy'."}, {"id": "4.3", "name": "Confirmed Assumptions Panel", "tagline": "A UX pattern for surfacing AI inferences, enabling user corrections, and building trust in agentic applications.", "overview": "Agentic systems constantly infer missing details (region, time horizon, currency, segments, permissions), and when those inferences are hidden, wrong, or overly sticky, trust erodes. The Confirmed Assumptions Panel is a dedicated surface where the system exposes its current assumptions, lets users edit them inline, and communicates how they influence outcomes.", "problem": ["Hidden assumptions make it hard to trace why the AI behaved the way it did.", "Wrong assumptions force people to redo work or abandon the flow.", "Sticky assumptions silently leak into future tasks, forecasts, and automations."], "useWhen": ["The AI creates plans, forecasts, or policies (financial, operational, legal).", "Actions have cost or risk (deployments, messaging, changes to live systems), or the product is multi-tenant with org defaults.", "Silent defaults could materially change numbers or stakeholder expectations."], "overkillWhen": ["The interaction is low-stakes and clearly reversible, or all relevant filters and choices are already visible in the core UI.", "You're only inferring trivial or cosmetic details."], "anatomy": [{"label": "Sidebar entry point", "desc": "A side panel titled 'Assumptions' listing the AI's active assumptions, always reachable."}, {"label": "Inline preview", "desc": "A preview of the assumptions inside the agent's message, e.g. 'Q4 timing, US-West region, USD pricing' with an Edit link."}, {"label": "Short label", "desc": "'Fiscal year', 'Currency', 'Primary region'."}, {"label": "Testable statement", "desc": "'Assuming your fiscal year starts on April 1.'"}, {"label": "Inline edit controls", "desc": "Editable inputs to confirm, change or scope the value, plus a Continue action to proceed with the edited values."}, {"label": "'Affects…' hint", "desc": "Lists impacted outputs: 'Used for send times, benchmarks, and cost estimates.'"}], "lifecycle": ["AI infers a value and logs it as Suggested.", "Suggested values are displayed to the user within the agent's message.", "User clicks Edit; the panel opens to the side, or the message area expands with editable inputs.", "User edits assumption values (and optionally scope, e.g. 'Remember for this org').", "User clicks Continue; the agent re-runs with the entered values and explains what changed.", "Conflicts with real data surface in the panel with one-click resolution."], "microcopy": ["Assuming your fiscal year starts on April 1.", "Using USD for all price and cost calculations.", "Affects: tax calculations, runway estimates, and YoY comparisons.", "Data conflict detected. Your imported data suggests the fiscal year starts in July. Update to July 1 / Keep April 1 for now"], "antiPatterns": [{"dont": "Overloading with minutiae: every internal threshold, model knob, or scoring weight becomes a decision for the user.", "do": "Surface only assumptions a human would want to question or tune; capture low-impact details in configuration docs."}, {"dont": "Non-editable 'assumptions': values that look negotiable but can't actually be changed here.", "do": "Treat it as configuration, not an assumption; link out to where it can really be changed."}, {"dont": "Hidden scope changes: light-looking toggles that quietly change org-wide behavior.", "do": "Always label scope, persistence, and who is affected; make org-wide or persistent changes unmistakably clear."}, {"dont": "Vague copy such as 'Using your usual settings' or 'Applied defaults' without saying which ones.", "do": "Use concrete, testable statements that name the value and what it affects."}], "a11y": [], "demoSummary": "A workspace agent asked to draft a quarter-end campaign shows 'Q4 timing, US-West region, USD pricing' with an Edit link and an Assumptions side panel (region, quarter definition, currency), each noting what it affects."}, {"id": "5.3", "name": "Tool Usage Indicators", "tagline": "Clear, contextual cues showing which tools an AI agent is using, what state each call is in, and how that activity interacts with data and systems.", "overview": "Tool Usage Indicators make an agent's interaction with external systems, data sources, and automations visible, distinguishing pure reasoning, read-only tool use, and write or side-effectful tool use instead of a generic 'thinking…' state. Short human-readable labels show which systems are accessed, whether operations read or write, and the stage of each call, with review and approval controls paired to higher-risk actions.", "problem": ["Unclear origin of answers: users can't tell whether a response came from the model, enterprise data, or the web.", "Hidden side effects: tickets created, emails sent, or records updated with no clear indication of when or how.", "Ambiguous 'thinking' state and weak auditability: one spinner conflates reasoning, tool calls, network delays, and approval waits."], "useWhen": ["Agentic workflows with tool orchestration: the agent can call APIs, run code, or interact with CRM, HRIS, ERP, ticketing, cloud.", "System-of-record changes: the agent can create, update or delete records, or send messages on a human's behalf.", "Multi-source retrieval/RAG where sources matter, or regulated domains needing transparent, auditable access and changes."], "overkillWhen": ["Simple, local-only tasks: rewriting, translating, or summarizing a short note with no external tools or data sources.", "Static, bounded operations a form or wizard already controls, or low-impact read-only queries against a single known source."], "anatomy": [{"label": "Inline tool status", "desc": "A compact 'Activity' or 'Tools used' section beneath responses, one line per tool with icon, label, and status."}, {"label": "Expandable details", "desc": "'View details' or a chevron reveals individual calls, durations, scopes, and error messages for power users and admins."}, {"label": "Task / job detail view", "desc": "Dedicated page or modal with the full tool usage timeline for long-running tasks, reached from toasts or job cards."}, {"label": "Tool Call Indicator", "desc": "Answers which tool, what the agent is doing, and status/impact: 'Preparing 12 CRM updates (pending approval)…'."}, {"label": "Controls", "desc": "Cancel/stop, retry failed call, open source system ('Open in CRM'), review pending diffs, approve or reject a write."}, {"label": "Metadata", "desc": "Tool identity, access mode (read-only/write/simulate), environment, scope counts, status (Queued → Awaiting approval → Completed)."}], "lifecycle": ["Request and planning: the agent decides which tools to call and in which order, mapped to plan steps if a plan pattern is present.", "Pre-run indication: 'Will search internal knowledge base and analytics warehouse.' so users can cancel or adjust scope.", "Initiation and live progress: icon, operation and 'In progress'; spinner plus milestones ('Scanning 1,200 transactions…').", "User control: cancel where possible; writes move to 'Awaiting approval' with 'Review 12 proposed changes', 'Approve all / individually'.", "Completion: spinner → checkmark, label shifts to past tense: 'Searched knowledge base (24 results found).'", "Failure and audit: 'Failed', 'Timeout', 'Permission denied' with recovery actions; all calls recorded in the expanded timeline."], "microcopy": ["Searching internal knowledge base…", "Running SQL query on analytics warehouse…", "Preparing write to CRM (pending approval)…", "CRM was unavailable; answer is based on ticket history only."], "antiPatterns": [{"dont": "Generic, Opaque 'Thinking' States: a single spinner for all activity, including tool calls.", "do": "Distinguish between reasoning, read-only calls, and write operations with specific indicators."}, {"dont": "Silent Writes and Hidden Side Effects: updating systems of record or sending messages with no visible indicator.", "do": "Always show write operations with clear labels and, for high-risk actions, approval controls."}, {"dont": "Overly Technical Labels: 'POST /api/v2/records' or 'sfdc-api' surfaced as user-facing labels.", "do": "Use domain language: 'Updating customer records in CRM' instead of technical API calls."}, {"dont": "Excessive Verbosity by Default: every paginated micro-call shown in the main chat view.", "do": "Keep the default view compact; offer 'View details' for deeper inspection."}], "a11y": ["Combine text status, icon state (spinner → check → warning), and subtle color so state is not conveyed by color alone.", "Limit concurrent motion when many tools run in parallel and respect reduced-motion preferences."], "demoSummary": "An interactive demo where running 'Audit this quarter's pipeline and update...' shows which tools the agent calls, what data they access, and their results as the request is processed."}, {"id": "5.4", "name": "Activity Timeline & Audit Log", "tagline": "Provide a transparent, structured history of what agents, tools, and humans did so teams can verify, debug, and govern AI-driven work.", "overview": "A chronological record of everything an AI agent, its tools, and human collaborators did while completing work, presented as a readable \"flight recorder\" alongside a run, task, or conversation. It logs who/what acted, when, on which resource, using which tool or data, and with what outcome, in a form legible to non-technical stakeholders yet precise enough for engineering, security, and legal teams.", "problem": ["Black-box behavior: agents run multi-step operations across services but only a final answer is visible, not the tools, data, or why.", "Difficult debugging and incident response: when results look wrong, teams lack the timelines needed to reproduce, triage, and fix.", "Compliance and governance gaps: audited environments need proof of what actions were taken, by whom, and under what authorization."], "useWhen": ["Multi-step agent workflows that orchestrate planning, tool calls, delegations, and revisions (investigations, forecasting, automation runs).", "High-impact or high-risk operations such as access changes, financial transactions, customer communications, or configuration changes.", "Shared multi-user environments, asynchronous background work, or products with governance and audit requirements."], "overkillWhen": ["Single-turn, low-risk chat with no side effects (e.g., pure Q&A with no data persistence).", "Operations are trivial, reversible, and directly observable in a local UI with full undo/redo, or simple inline histories already suffice."], "anatomy": [{"label": "Primary navigation", "desc": "A \"Runs,\" \"History,\" \"Activity,\" or \"Audit Log\" item in product navigation listing all recent agent activity."}, {"label": "Task or run details", "desc": "A tab or panel labeled \"Timeline,\" \"Execution,\" or \"Activity\" inside a run/task detail view."}, {"label": "Contextual links", "desc": "Inline \"View activity\" / \"View log\" links from notifications, error banners, or resource records."}, {"label": "System alerts & incidents", "desc": "Links from alert details or incident dashboards that jump directly into the relevant segment of the log."}, {"label": "Core item: Event", "desc": "A discrete action by an actor (agent, tool, system, human) at a point in time; label is actor + verb + object in domain language."}, {"label": "Event metadata", "desc": "Timestamp, actor type and identity, tool used, status, scope, cost/performance, and correlation IDs or trace spans."}], "lifecycle": ["Before the run: timeline visible but empty or showing pre-run events (\"Task created,\" \"Agent assigned\"); hints that events will stream in.", "During the run: events appended chronologically, statuses update (Pending > Running > Completed/Failed), a \"Live\" pill signals real-time updates.", "Post-completion: timeline becomes a stable, read-only record with filters, search, and grouping.", "Filtering & search: by actor, tool, data source, status, severity, resource type, or tag; group by step, agent, resource, or environment.", "Details & expansion: full prompts/responses (redacted as needed), tool parameters, data references, guardrail interventions, source links.", "Annotations, persistence & export: events immutable and only annotated; export CSV/JSON/PDF; retention configurable per tenant."], "microcopy": ["Access Manager Agent updated role 'Billing Admin' for user alex@example.com.", "Skipped deploy step because tests failed in stage 'staging'.", "This timeline will capture each tool the agent calls, who requested it, and what changed.", "Events before Aug 1 are unavailable due to retention policy."], "antiPatterns": [{"dont": "Overwhelming verbosity: logging every token-level prompt, internal retry, or system event without summarization.", "do": "Summarize repetitive events and provide expand controls for detailed traces when needed."}, {"dont": "Incomplete or misleading histories that omit failed attempts, guardrail interventions, or policy denials.", "do": "Include all meaningful events, including failures and policy enforcement actions."}, {"dont": "Editable audit trails that allow events to be edited or removed.", "do": "Make events immutable; only annotations should be mutable."}, {"dont": "Ambiguous attribution: logs that do not clearly state whether a human or an agent performed an action.", "do": "Always include explicit actor attribution with a clear human vs. agent distinction."}], "a11y": [], "demoSummary": "A SecOps incident-response timeline where an admin triggers an IP investigation and each agent step (plan, log query, reputation check, block recommendation) is logged with timestamp, tool, status, and View Data links."}, {"id": "6.1", "name": "Source Anchoring & Grounding", "tagline": "Connects AI-generated outputs to verifiable underlying sources so that every critical statement can be traced, inspected, and trusted.", "overview": "A trust pattern that links AI responses to the underlying evidence the system relied on (documents, code, databases, logs, dashboards, or external APIs), shown alongside messages, result views, or side panels. Rather than asking users to \"just trust the AI,\" it makes verifying key statements trivial and clarifies what is grounded in enterprise data versus inferred.", "problem": ["Opaque reasoning: the system returns a confident answer but users cannot see what it looked at; every answer becomes a mini trust exercise.", "High verification cost: validating output means manual search through documents, dashboards, or code, often slower than skipping the AI.", "Risk and accountability gaps, plus a false sense of security when citation-style UI points to stale or weakly related sources."], "useWhen": ["Evidence-sensitive workflows where decisions rely on policies, contracts, logs, or metrics (legal, compliance, HR, finance, security).", "Enterprise knowledge assistants answering questions about internal systems, product docs, customer records, or project history.", "Data-backed recommendations and summaries, or multi-step agent workflows where teams must see which tool calls support which claims."], "overkillWhen": ["Low-stakes, reversible tasks (playful, creative) or obvious local context where the single source is already in full view.", "Trivial or generic public knowledge, or when establishing reliable sources is technically complex but the domain has minimal risk."], "anatomy": [{"label": "Inline within AI messages", "desc": "Superscript markers, small link icons, or \"View sources (3)\" chips directly in or near text segments."}, {"label": "Side panel / details drawer", "desc": "A \"Sources,\" \"Evidence,\" or \"References\" affordance opening a right-hand panel listing documents, queries, and tool calls."}, {"label": "Split-screen mode", "desc": "An \"Open side-by-side\" control that rearranges the layout so the AI answer and primary source are visible together."}, {"label": "Tool activity timeline", "desc": "For agentic systems, an activity log exposing tool calls that can be expanded for details."}, {"label": "Core item: Source citation", "desc": "A chip, superscript, or list item, e.g. \"Employee Handbook – Time Off Policy\" with description \"Clause defining carry-over PTO.\""}, {"label": "Citation controls & metadata", "desc": "Open in viewer, jump to highlight, expand context, copy link; last updated, source type, match strength, access cues."}], "lifecycle": ["Initial generation: agent associates each key statement with retrieved sources; UI shows a clean answer with compact citation markers.", "On hover/focus: lightweight preview with title, snippet, and metadata showing which source supports which part of the answer.", "On click: richer view (side panel, modal, or split-screen) with the referenced fragment highlighted and an obvious way back.", "Multi-source inspection: sources as list or tabs ordered by relevance; a consolidated Evidence section groups by type or document.", "Re-grounding and refresh: \"Refresh using latest data\" regenerates with updated sources, clearly indicating changes.", "Absence, history and export: state when not grounded and never fabricate citations; each message keeps its sources; exports include a source appendix."], "microcopy": ["Based on internal HR policy documents", "Source: Employee Handbook – Time Off Policy (updated Sep 2025)", "3 sources found – click to view evidence", "No relevant internal source found; showing general guidance"], "antiPatterns": [{"dont": "Cosmetic citations that show only generic document titles or point to irrelevant passages.", "do": "Ensure citations link to specific, relevant passages with clear context."}, {"dont": "Overwhelming detail: too many citations, long reference lists, or noisy traces.", "do": "Prioritize the most relevant sources and use progressive disclosure for additional evidence."}, {"dont": "False sense of certainty via checkmarks or \"verified\" labels when sources are weak or incomplete.", "do": "Accurately represent grounding strength and clearly communicate limitations."}, {"dont": "Inconsistent coverage: only some answers are grounded with no visible differentiation.", "do": "Always indicate grounding status clearly, even when no sources are available."}], "a11y": ["Citation UI should be accessible: keyboard operable, screen-reader friendly, with adequate contrast and focus states."], "demoSummary": "An AI legal assistant answers a question about data-breach liability in a Master Services Agreement with streamed inline citations [1], [2] that highlight the exact source clauses in a document viewer on hover or click."}, {"id": "6.2", "name": "Confidence Thermometer", "tagline": "A compact visual and textual indicator that communicates an AI system's self-assessed confidence in its outputs, guiding appropriate scrutiny and next steps.", "overview": "An inline UI element that exposes how certain an AI system is about a specific output or action, combining an icon or gauge, a textual label (e.g., High confidence), and optional detail explaining why. It sits adjacent to AI messages, recommended actions, or generated artifacts, clarifying strong recommendations versus tentative suggestions and directing attention to what merits review.", "problem": ["Overtrust and silent errors: users accept polished AI answers as fact, causing incorrect updates, risky decisions, or compliance violations.", "Undertrust and underuse: in high-stakes workflows teams assume the AI is unreliable and ignore good ideas since it never signals certainty.", "Unclear next steps when uncertainty is high: users are left guessing whether to refine the prompt, consult a colleague, or switch tools."], "useWhen": ["AI recommendations influence irreversible or costly actions: financial transactions, lead routing, access control, pricing, medical triage.", "The AI aggregates or extrapolates from heterogeneous or incomplete data, such as combining logs, CRM records, and external benchmarks.", "Regulatory, contractual, or reputational risk is non-trivial, or teams explicitly need to calibrate trust in AI during adoption."], "overkillWhen": ["Purely cosmetic or easily reversible tasks (changing tone, formatting, resizing images), or deterministic logic like sorting or sums.", "The UI already has simple binary validation, or very low-stakes consumer contexts where minor mistakes are easy to spot and ignore."], "anatomy": [{"label": "Inline in AI chat messages", "desc": "Attached to each AI response or section header, often near a timestamp or message menu, without interrupting reading flow."}, {"label": "Inline in structured outputs", "desc": "Adjacent to rows, cards, or sections in generated content (lead scores, campaign variants, contract clauses)."}, {"label": "Side panel or summary bar", "desc": "Overall confidence for multi-step plans or automation recipes, with drill-down into per-step confidence."}, {"label": "Contextual surfaces", "desc": "Notifications, banners, or toasts for significant actions, e.g. \"Auto-close 37 tickets – Medium confidence.\""}, {"label": "Core item: Confidence indicator", "desc": "A band label, optionally numeric (\"Medium confidence (≈70%)\"), plus concise text explaining why the system is at that level."}, {"label": "Controls & metadata", "desc": "\"Show reasoning,\" \"Recalculate with new inputs,\" \"Mark as incorrect\"; data recency, sources, risk flags, review status."}], "lifecycle": ["Initial behavior: user initiates a request; a loading state shows without yet rendering a confidence indicator.", "Confidence estimation: computed from model probabilities, historical accuracy, data quality checks, or agreement between sources.", "Indicator rendering: output shown with a Low/Medium/High label, a visual cue (bar, dot, or icon), and optional numeric range.", "Explanation and grounding: hover or click reveals why confidence is at that level, key drivers, and known gaps or caveats.", "Adaptive next steps: High offers \"Apply change\"; Medium prompts \"Adjust assumptions\"; Low suggests \"Verify with dashboard\".", "Re-evaluation and f

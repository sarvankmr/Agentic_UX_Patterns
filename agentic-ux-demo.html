eedback loop: users refine context and the system recalculates; accepted/edited/rejected outcomes feed calibration."], "microcopy": ["MEDIUM CONFIDENCE", "Low confidence – incomplete data", "Confidence increased after adding Q4 data", "Data last updated 3 days ago"], "antiPatterns": [{"dont": "Always-high confidence: presenting every result as \"High confidence.\"", "do": "Calibrate thresholds against real-world accuracy data and vary confidence appropriately."}, {"dont": "False precision like \"83.7% confidence\" that suggests certainty the system does not possess.", "do": "Use coarse bands (Low / Medium / High) that match actual predictive reliability."}, {"dont": "Ambiguous semantics: mixing confidence with importance, impact, or urgency in the same visual.", "do": "Keep confidence indicators separate from other metrics with distinct visual treatments."}, {"dont": "Hidden or buried uncertainty deep in secondary overlays or footnotes.", "do": "Make confidence visible inline, directly adjacent to the AI output it describes."}], "a11y": ["Do not rely solely on color: pair it with icons, text labels, or patterns.", "Indicators and overlays must be reachable by keyboard with semantic labels for screen readers; respect motion preferences."], "demoSummary": "A sales-forecasting assistant shows Low/Medium/High confidence thermometers on each regional forecast, with \"Show details\" revealing factors like data recency and pattern strength and a \"Regenerate Forecasts\" button to vary scenarios."}, {"id": "7.6", "name": "Escalation & Fallback Routing", "tagline": "A structured way for agentic systems to hand off work when limits are reached, routing to alternative agents or humans while keeping the process transparent, auditable, and controllable.", "overview": "A pattern for multi-agent and agentic systems that ensures work does not stall when an agent lacks the capability, confidence, permissions, or context to complete a task. Instead of failing silently or looping, the system routes the task to a more appropriate handler (another agent, a simpler deterministic workflow, or a human) with visible reasons and tunable controls.", "problem": ["Silent failures and loops: agents repeatedly attempt actions that cannot succeed, seeming to \"think\" forever while nothing progresses.", "Unclear responsibility and next steps: vague errors or generic apologies with no sign of what happens next or whether anyone is looking.", "Inconsistent, opaque risk handling and poor handoffs that lose context, forcing users to restate information."], "useWhen": ["High-risk or regulated decisions: financial advice, medical triage, safety-critical operations, compliance checks.", "Systems with multiple agents or specialized capabilities, where one agent orchestrates others or offloads to narrower deterministic agents.", "Long-running multi-step workflows, or environments with strict SLAs or audit needs (support, fraud detection, operations)."], "overkillWhen": ["Low-stakes, reversible tasks (casual Q&A, non-critical drafting) or single-shot interactions where orchestration cost outweighs benefit.", "Highly deterministic pipelines already governed by robust validation where failures are rare and trivially handled."], "anatomy": [{"label": "Inline in conversation", "desc": "Banner or inline message indicating that escalation has occurred, with a link to view details."}, {"label": "Operations / admin console", "desc": "Dedicated \"Escalations\" or \"Exceptions\" tab with open cases, queues, status, and a rules editor for triggers and routes."}, {"label": "Notifications & alerts", "desc": "Email, in-app, or chat alerts to human operators, optionally for high-risk or SLA-breaching cases."}, {"label": "Core item: Escalation case", "desc": "A routed task with a summary label (\"Escalated: high-risk transfer – low confidence classification\"), request, attempts, triggers."}, {"label": "Case controls", "desc": "Claim/assign owner, re-route to another queue or agent, retry with updated parameters, mark resolved, feedback tags."}, {"label": "Case metadata", "desc": "Confidence scores, risk level, SLA target and time remaining, tenant details, audit references (request, policy, model versions)."}], "lifecycle": ["Initial request & primary handling: a primary or orchestrator agent attempts the task within defined constraints.", "Detection of limitation or risk: low confidence, conflicting outputs, repeated errors, policy flags, or out-of-scope requests.", "Rule evaluation & routing: a configurable rules engine, e.g. IF confidence < 0.7 AND risk_level != low THEN route_to human_specialist.", "Fallback or escalation execution: route to a narrower agent or deterministic service, or create an Escalation Case with full packaged context.", "User-facing feedback and intervention: user sees status and can add context; assignee sees timeline, reason, and approve/adjust/reject controls.", "Resolution and learning: case closed with status and labels; logged data tunes rules, improves agents, and informs queue capacity."], "microcopy": ["This request has been escalated to a human specialist due to ambiguous tax rules. View details.", "A specialist is reviewing this request due to conflicting data. No changes have been applied yet.", "In review – human specialist", "Completed – human approved"], "antiPatterns": [{"dont": "Escalation as a generic catch-all error: escalating every failure without analyzing root causes.", "do": "Categorize failures and create targeted escalation rules for each category."}, {"dont": "Opaque \"magic handoffs\" that re-route behind the scenes without any user-facing indication.", "do": "Always notify users when escalation occurs and provide visibility into its status."}, {"dont": "Context-poor escalations sending only minimal information or raw logs to human reviewers.", "do": "Package full context including conversation history, agent actions, and recommendations."}, {"dont": "Over-reliance on confidence scores alone as the escalation trigger.", "do": "Combine confidence with risk level, user segment, action type, and business rules."}], "a11y": [], "demoSummary": "An AI agent handling a tax-filing request retrieves records, hits a permission barrier on financial projections, and escalates to a Financial Specialist queue with a case card whose \"View Details\" shows trigger, attempted actions, and context."}, {"id": "8.1", "name": "Memory Inspector & Editor", "tagline": "A dedicated surface that exposes an AI agent's stored memories as structured, editable items, enabling transparent personalization and explicit control over what the agent remembers and uses.", "overview": "A dedicated, structured surface where an AI agent's persistent memories about a person, organization, or workspace are visible, understandable, and controllable. By treating memories as data objects rather than opaque model state, it improves predictability, enables correction of inaccuracies, reduces risk from outdated information, and supports privacy and compliance expectations.", "problem": ["Opaque personalization: outputs suddenly reference past details (role, tone, preferences) with no explanation of origin or current accuracy.", "Accumulated inaccuracies: outdated facts like role changes or new constraints persist and keep influencing responses across sessions.", "Lack of control and consent, and no obvious place to diagnose which belief is responsible when the agent \"gets stuck\" in a pattern."], "useWhen": ["An agent maintains long-lived personalization across sessions, devices, or channels, or infers traits and constraints from natural language.", "Multiple users share workspace or organizational agents that rely on shared context or rules.", "Incorrect personalization can have material consequences, or products are sold into enterprise or regulated environments that expect governa"], "overkillWhen": ["The agent is intentionally stateless, or personalization is a few explicit low-risk settings (theme, language) in a normal preferences page.", "The system stores only ephemeral, low-impact hints, or long-term memory is disabled by design to minimize risk."], "anatomy": [{"label": "Global navigation", "desc": "A persistent entry labeled \"Memory,\" \"Agent Memory,\" or \"AI Data\" in the primary nav, app header, or profile dropdown."}, {"label": "Agent / AI settings", "desc": "A section within \"AI Settings,\" \"Preferences,\" or \"Privacy & Data\" alongside other personalization and data-use controls."}, {"label": "Inline within chat", "desc": "Chips and banners when memories are read or written, e.g. \"Used memory: Preferred tone – concise.\""}, {"label": "Notifications and digests", "desc": "Periodic summaries like \"3 new memories added this week\" with deep links; useful for admins needing passive monitoring."}, {"label": "Core item: Memory record", "desc": "A human-readable belief such as \"Role: Senior Product Manager, Data Platform\" with category, scope, and source."}, {"label": "Record controls & metadata", "desc": "Edit, change scope, pin/protect, delete with undo, expand history; source (explicit, inferred, synced, admin), timestamps, status."}], "lifecycle": ["Detection & candidate creation: agent spots durable info (roles, projects, preferences) and drafts a record with label, value, category, scope.", "Confirmation: impactful or sensitive candidates enter \"pending review\" with options like \"Save,\" \"Save for this project only,\" \"Do not remember this.\"", "Storage & organization: confirmed records grouped into categories (Preferences, Personal Facts, Org Data, Long-Term Tasks, Insights).", "Usage & attribution: chips, badges, or callouts show which memories influenced behavior; usage recorded for audit and debugging.", "Editing & conflict resolution: edit inline or via \"Edit this memory\" links in chat; conflicts highlighted; version history allows rollback.", "Expiration & deletion: session-only, time-bound, project-bound, or persistent scopes; deletion flows explain impact and propagate auditably."], "microcopy": ["Used memory: Preferred tone – concise", "Saved to memory: role = Sales Ops Manager [Review]", "Potentially outdated: project deadline 2023-03-01", "Visible to: only this account"], "antiPatterns": [{"dont": "Opaque memory use: storing and reusing memories without exposing them, which feels \"creepy\" or arbitrary.", "do": "Always surface when memories are used, with clear attribution and edit affordances."}, {"dont": "Overly technical representations: raw prompts, embeddings, IDs, or database records.", "do": "Present memories as human-readable statements with clear labels and plain-language descriptions."}, {"dont": "All-or-nothing controls: only a global \"Clear all memory\" option.", "do": "Offer granular controls: edit individual records, delete specific items, adjust scope per memory."}, {"dont": "Silent overwrites: automatically replacing memories with new inferences without signaling the change.", "do": "Notify users of updates, show version history, and allow pinning to prevent automatic overwrites."}], "a11y": ["Use typographic hierarchy rather than color alone, with full keyboard navigation whose tab order follows reading order.", "Provide robust screen-reader support with descriptive labels for memory records and controls; use iconography consistently and sparingly."], "demoSummary": "A chat where the agent personalizes a Q4 pipeline summary sits beside a Memory Inspector listing Preferences, Personal Facts, and protected Org Rules, with hover revealing metadata, scope, and edit controls."}, {"id": "8.2", "name": "Agent Persona Profiles & Settings", "tagline": "Configurable agent persona profiles that define how AI agents behave, including role, tone, capabilities, and risk posture, and are surfaced as governed, reusable objects across the product.", "overview": "Defines how an AI agent behaves in a product and makes that behavior explicit, consistent, and governable through named, structured personas that answer \"which agent is acting, on whose behalf, with what powers, and in what style?\" It appears as an Agent Gallery, inline agent selectors, and visible active-agent indicators, so risk posture and capabilities are governed centrally rather than improvised per prompt.", "problem": ["Opaque behavior and identity: users cannot tell whether a response comes from a generic assistant, a specialized tool, or a test agent.", "Inconsistent tone, risk posture, and capabilities: teams configure agents independently, so the AI is cautious here and guesses aggressively", "Unclear limits and weak governance: users do not know what the agent may do, and scattered prompt config is hard to review, version, or trac"], "useWhen": ["Multiple AI agents (drafting, reviewing, summarizing, triaging) must behave differently by design, or multi-agent stages need clear roles.", "Organizations need consistent, reusable AI behavior across teams, or regulated domains where risk posture and tool access must be auditable.", "Offering tenant-configurable AI where admins need a safe way to adjust tone, tools, and scope without editing raw prompts or code."], "overkillWhen": ["A single, low-risk assistant with a fixed role and minimal capabilities, or non-agentic bounded features like autocomplete or grammar fixes.", "Early-stage prototypes still exploring behavior, or a small team that can manage behavior through a simple global settings panel."], "anatomy": [{"label": "Global / navigation-level", "desc": "\"AI Agents\" or \"Personas\" entry in admin or workspace settings; an organization-level Agent Gallery."}, {"label": "Workflow-level", "desc": "Agent selector dropdown or segmented control near the chat input or generation trigger; per-feature default persona."}, {"label": "Contextual / inline", "desc": "A chip in the conversation header such as \"Agent: Compliance Reviewer (Conservative)\" with a tooltip link to details."}, {"label": "Core item: Agent persona", "desc": "Identity (name, mission statement, owner, environment tags) plus scope and capabilities (domains, content types, allowed tools)."}, {"label": "Tone & risk posture", "desc": "Concise vs detailed, formal vs casual; posture \"Experimental,\" \"Balanced,\" \"Conservative,\" or \"Safety-first\" mapped to guardrails."}, {"label": "Escalation, controls & metadata", "desc": "Defer-to-human rules and triggers; Activate, Set as default, Edit, Duplicate, Archive, version history; status and approvals."}], "lifecycle": ["Creation & drafting: from scratch or a template, defining role, scope, tone, capabilities, and risk posture with default safe settings.", "Review & governance: higher-risk personas follow approval workflows; changes versioned with diffs; Draft > In Review > Approved > Live.", "Assignment & targeting: default persona per workspace or product area, with overrides per team, project, or pipeline.", "Runtime activation: the active agent is indicated near the interaction surface; switching is explicit and often requires confirmation.", "Interaction & escalation: agent acts per its posture, asks for clarification, requests approval for risky actions, escalates when triggered.", "Monitoring, evolution & deprecation: feedback attributed to persona and version; gradual rollouts; old versions retained for audit."], "microcopy": ["Agent: Postmortem Drafter (Balanced)", "Conservative – Strict adherence to facts. No speculation. Best for compliance.", "v7 – enabled access to CRM notes; approved by Legal.", "Environment: Staging, Actions: Draft-only"], "antiPatterns": [{"dont": "Hidden personas: role, scope, and risk posture embedded in prompts but never exposed in the UI.", "do": "Make personas visible and inspectable with clear indicators in the UI."}, {"dont": "Overlapping or confusing personas like \"Sales Helper 1\" and \"Sales Helper 2\" that cause misselection.", "do": "Use distinct, functional names with clear descriptions of each persona's unique purpose."}, {"dont": "Unbounded editing of compliance or safety-critical personas by end-users without review.", "do": "Implement approval workflows and role-based access for editing sensitive personas."}, {"dont": "Mismatch between persona and capability, e.g. a \"Compliance Reviewer\" configured with broad write access.", "do": "Ensure persona names accurately reflect their actual capabilities and risk posture."}], "a11y": ["Avoid encoding risk posture purely through color; combine iconography and text."], "demoSummary": "An admin configuration interface for Legal Briefing Agent, Contract Drafter, and Negotiation Strategist personas, where you adjust risk tolerance (Conservative/Balanced/Experimental), toggle capabilities, and save versioned changes."}, {"id": "9.1", "name": "Safe Failure States", "tagline": "Agentic AI systems avoid harmful or confusing behavior by failing in clear, contained, and recoverable ways that protect data, preserve context, and maintain trust.", "overview": "A pattern for handling AI breakdowns, uncertainty, and guardrail violations in a way that keeps people, data, and systems safe while preserving trust in the product. Instead of producing something at all costs or silently dropping actions, the system deliberately abstains, degrades, or rolls back in controlled ways, explains why, and offers clearly bounded next steps.", "problem": ["Opaque or silent failure: the AI ignores a request, times out, or says \"Something went wrong\" with no path forward.", "Unsafe behavior on low confidence: models proceed despite uncertainty or partial context, sending wrong emails or mutating production data.", "Dead ends and lost work, plus error messages that blame the person rather than acknowledging system limits."], "useWhen": ["An agent can perform high-impact or irreversible actions such as deployments, deletions, bulk updates, notifications, or payments.", "Workflows span multiple steps, tools, or external systems, or the system must abstain on low-confidence or conflicting signals.", "Regulatory, legal, or safety constraints require audit trails whenever the AI declines, rolls back, or asks for human intervention."], "overkillWhen": ["Low-stakes, single-step generators (e.g., rewriting a headline) where undo and revision tools already provide safe recovery.", "Strictly read-only AI, platform-level error handling already covers it, or internal prototypes on synthetic or disposable data."], "anatomy": [{"label": "Inline in the chat thread", "desc": "An assistant message or card in direct response to a prompt, describing what prevented the requested action."}, {"label": "Agent run / workflow detail views", "desc": "A run or job page showing where the plan failed, including which step, tool, or environment triggered the safe failure."}, {"label": "Contextual UI around critical actions", "desc": "Modals, inline callouts, or banners on deployment dashboards, CRM bulk updates, or campaign screens tied to the blocked action."}, {"label": "Core item: Safe failure block", "desc": "Status label (\"Deploy paused – failing tests detected\"), what was attempted, what triggered the failure, and the current state."}, {"label": "Controls", "desc": "Retry, refine inputs, run in safe mode (preview only, draft but do not send), escalate, override (often gated by role)."}, {"label": "Metadata", "desc": "Timestamp, environment, impacted entities, error category, confidence or threshold info, links to logs, metrics, or traces."}], "lifecycle": ["Initial request & planning: the person issues a request (e.g., \"Deploy to production\"); the agent plans, selects tools, and begins executing.", "Detection & classification: low confidence, missing input, violated guardrail, API error, or permission failure is classified to pick a strategy.", "Containment & rollback: the agent stops further actions, rolls back partial changes if needed, and falls back to read-only mode.", "Communication in context: a Safe Failure Block appears at the breakdown point, stating what was not completed, why, and what changed.", "Recovery & alternatives: explicit options by severity, clarification, a safer environment (staging), or routing to a human or approval flow.", "Override with consent and learning: privileged users may proceed with logged approval; events logged with category, severity, recovery path."], "microcopy": ["Production deploy paused – elevated error rates detected.", "No changes have been made. Current version is still live.", "Bulk update cancelled – contacts were not changed.", "Override and deploy anyway (requires approval)"], "antiPatterns": [{"dont": "Vague or generic failures like \"Something went wrong\" without explanation.", "do": "Provide specific status, explanation, and actionable next steps in every failure message."}, {"dont": "Blaming the user with messages implying the person did something wrong.", "do": "Focus on system limits and next steps, not user actions; use neutral, supportive language."}, {"dont": "Dead ends with no recovery: failure states that discard context and offer no path forward.", "do": "Always provide at least one recovery option: retry, refine, escalate, or safe mode."}, {"dont": "Over-triggering safe failures that block routine, low-risk actions.", "do": "Calibrate thresholds; reserve safe failures for genuinely high-impact or uncertain situations."}], "a11y": ["Text explanations accompany any color, icon, or animation; use clear headings and ARIA roles, announcing changes like \"Deploy paused.\"", "Avoid idioms in error messages; provide sufficient contrast, spacing, and typography for scanning under incident-response stress."], "demoSummary": "A DevOps copilot pauses a production deploy after detecting elevated error rates, confirms no changes were made, and offers View failing metrics, Cancel deploy, and Override (admin authorization) buttons."}, {"id": "10.3", "name": "Access & Permission Tiers for Agents", "tagline": "A structured way to define, assign, and expose granular permission tiers for AI agents so that agent behavior remains aligned with organizational roles, environments, and risk thresholds.", "overview": "A standardized, fleet-wide approach to limiting what AI agents can see and do by grouping capabilities into clearly defined tiers (Viewer, Editor, Executor, Admin, Supervised Executor) applied consistently across agents, environments, and tenants. It aligns agent privileges with existing IAM constructs, applies least privilege by default, and makes effective capabilities observable to administrators and end-users.", "problem": ["Opaque capabilities: agents read or change data with no visible indication of what they may access, causing anxiety and hesitation.", "Over-privileged agents with broad write/execute rights far beyond need, or under-privileged agents that silently fail and frustrate users.", "No fleet-level control for administrators and inconsistent enforcement across staging, QA, and production."], "useWhen": ["Agentic features operate on real customer or business data (CRM, telemetry, billing, HR, healthcare) rather than synthetic or demo content.", "Agents can perform state-changing actions: editing records, triggering workflows, provisioning infrastructure, sending messages, payments.", "Multiple environments where the same agent should behave differently, regulated domains, or multi-tenant enterprise deployments."], "overkillWhen": ["The agent gives read-only generic assistance over non-sensitive data, or a single low-risk agent needs only an on/off or \"can edit\" toggle.", "Local-only or purely experimental playgrounds, or existing IAM and UI already make the agent's single capability obvious and trivial."], "anatomy": [{"label": "Tier definitions", "desc": "A global set of tiers describing bundles of capabilities: resources readable or modifiable, executable actions, risk classification."}, {"label": "Agent assignments", "desc": "Mapping each agent to a tier per environment, tenant, or scope, with override and inheritance rules."}, {"label": "Runtime enforcement & disclosure", "desc": "Which actions are allowed, how escalations are handled, and how permissions are explained in the interface."}, {"label": "Primary: Admin / governance", "desc": "An \"Agents,\" \"AI Governance,\" or \"Access Control\" section listing all agents with tier, environment, owner, and risk level."}, {"label": "Contextual: Runtime & notifications", "desc": "Inline chat messages stating the tier, banners when an action is blocked, alerts on tier changes or unusual escalations."}, {"label": "Core object: Agent access profile", "desc": "Tier label (\"Viewer,\" \"Editor,\" \"Executor\"), plain-language description, tier selector, permission matrix, environment and risk metadata."}], "lifecycle": ["Initial defaults: least-privilege tiers defined as bundles of granular capabilities (data scopes, API scopes, tool access, action types).", "Agent creation & tier assignment: creator picks a tier with sensible defaults; UI explains trade-offs; assignment can differ per environment.", "Environment- and role-aware enforcement: Effective Permissions = Org Policy ∩ Environment Policy ∩ Human Role ∩ Agent Tier; blocks are explained.", "User-facing disclosure & control: concise summaries of abilities; users may limit the agent further or request higher tiers via approval workflows.", "Supervision & approvals: supervised tiers prepare changes delivered with Approve/Modify/Reject controls; approvals logged with identity and justification.", "Monitoring, simulation & decommissioning: privileged actions and tier changes logged with diffs; simulate before applying; revoke credentials on retirement."], "microcopy": ["Can read data and suggest changes.", "Audit log enabled for all write operations.", "This assistant can view records but cannot change clinical information.", "Last review: Dec 01, 2025 by System Admin."], "antiPatterns": [{"dont": "Agent permissions exceeding human permissions, allowing privilege escalation beyond the invoking user.", "do": "Compute effective permissions as the intersection of human rights, agent tier, and environment policies."}, {"dont": "Silent denials: the agent repeatedly declines or gives vague errors without saying permissions are the cause.", "do": "Give explicit, non-sensitive explanations and link to a \"Capabilities\" or \"Permissions\" panel for detail."}, {"dont": "Excessive tiers or overly complex matrices that overwhelm administrators into overusing high-power tiers.", "do": "Keep tier sets small and stable; use scoped capabilities within tiers rather than multiplying tiers."}, {"dont": "Unlogged manual overrides or one-off emergency escalations granted without audit trails.", "do": "Require justification and logging for all overrides; make temporary elevations expire automatically."}], "a11y": [], "demoSummary": "An AI Governance fleet table of five agents across Production, Staging, and Sandbox with tier dropdowns (Viewer, Editor, Supervised Executor, Executor) and a right panel showing each agent's effective permission matrix."}];window.__IC__={"rename": "<path d=\"M19 4L17 4L17 20L19 20L19 21L14 21L14 20L16 20L16 4L14 4L14 3L19 3L19 4ZM15 6L15 18L2 18L2 6L15 6ZM22 18L18 18L18 16L20 16L20 8L18 8L18 6L22 6L22 18ZM9 7.2L9 14C9 14.544 8.97 14.911 8.943 15.245C8.921 15.524 8.9 15.781 8.9 16.1L10.3 16.1L10.3 15.2C10.669 15.84 11.361 16.225 12.1 16.2C12.759 16.21 13.387 15.915 13.8 15.4C14.335 14.672 14.649 13.803 14.7 12.9C14.7 11 13.7 9.7 12.2 9.7C11.493 9.703 10.827 10.036 10.4 10.6L10.4 7.2L9 7.2ZM7.6 10.6C7.06 10.024 6.286 9.729 5.5 9.8C4.704 9.773 3.913 9.945 3.2 10.3L3.6 11.3C4.128 11.022 4.706 10.852 5.3 10.8C5.682 10.758 6.064 10.892 6.336 11.164C6.608 11.436 6.742 11.818 6.7 12.2L6.7 12.3L5.7 12.3C5.086 12.266 4.471 12.368 3.9 12.6C3.232 12.888 2.828 13.576 2.9 14.3C2.894 14.815 3.109 15.309 3.492 15.653C3.875 15.998 4.389 16.16 4.9 16.1C5.623 16.138 6.323 15.844 6.8 15.3L6.8 16L8.1 16C8.013 15.471 7.98 14.936 8 14.4L function buildPanel(id) {

  p.setAttribute("aria-label", P.title);
  p.innerHTML = `<header class="panel__head" title="Drag to a snap zone">

      <span class="panel__title">${ic(P.icon, "sdl-icon--sm")}<span class="ptitle">${esc(P.title)}</span></span>
      <span class="panel__extra"></span>
      <span class="panel__snap">

        <button class="sdl-icon-btn" data-act="close" title="Close" aria-label="Close">${ic("close")}</button>
      </span></header>
    <div class="panel__body"></div>`;
  p.querySelector(".panel__snap").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;

    if (a === "max") { P.max = !P.max; P.state = "open"; if (P.max) Object.keys(PANELS).forEach(k => { if (k !== id) PANELS[k].max = false; }); layoutPanels(); }
    if (a === "collapse") { P.state = "collapsed"; P.max = false; layoutPanels(); }
    if (a === "close") closePanel(id);
  });
  initDrag(p, id);
  P.el = p; P.body = p.querySelector(".panel__body");
  return p;
}
function snapPanel(id, side) { const P = PANELS[id]; P.dock = side; P.state = "open"; P.max = false; layoutPanels(); }
function openPanel(id, opts = {}) {
  const P = PANELS[id];
  if (opts.dock) P.dock = opts.dock;
  P.state = "open";
  if (isNarrow()) Object.keys(PANELS).forEach(k => { if (k !== id && PANELS[k].state === "open") PANELS[k].state = "collapsed"; });
  layoutPanels();
}
function closePanel(id) {
  const P = PANELS[id]; P.state = "closed"; P.max = false;
  if (id === "trace" && S.traceSnapped) { S.traceSnapped = false; renderAllTraces(); }
  layoutPanels();
}
function layoutPanels() {
  const docks = { left: $("#dock-left"), right: $("#dock-right") };
  Object.values(docks).forEach(d => { d.querySelector(".dock__tabs").innerHTML = ""; d.querySelector(".dock__stack").innerHTML = ""; });
  const widths = { left: 0, right: 0 };
  ["guide", "details", "trace"].forEach(id => {
    const P = PANELS[id]; const p = P.el;
    p.classList.toggle("is-max", P.max && P.state === "open");
    if (P.state === "closed") { p.remove(); return; }
    const sideBtn = p.querySelector('[data-act="side"]');
    const other = P.dock === "left" ? "right" : "left";
    sideBtn.innerHTML = ic(other === "left" ? "dockLeft" : "dockRight");
    sideBtn.title = sideBtn.ariaLabel = "Snap " + other;
    const mb = p.querySelector('[data-act="max"]');
    mb.innerHTML = ic(P.max ? "restore" : "maximize");
    mb.title = mb.ariaLabel = P.max ? "Restore to dock" : "Expand";
    if (P.state === "collapsed") {
      p.remove();
      const t = el("button", "edge-tab", `${ic(P.icon)}<span>${esc(P.title)}</span>`);
      t.title = "Expand " + P.title;
      t.addEventListener("click", () => openPanel(id));
      docks[P.dock].querySelector(".dock__tabs").appendChild(t);
      return;
    }
    if (P.max) { $("#ws").appendChild(p); return; }
    docks[P.dock].querySelector(".dock__stack").appendChild(p);
    widths[P.dock] = Math.max(widths[P.dock], P.width);
  });
  docks.left.style.setProperty("--dock-w", (widths.left || 360) + "px");
  docks.right.style.setProperty("--dock-w", (widths.right || 400) + "px");
  $("#hdr-guide").classList.toggle("is-selected", PANELS.guide.state === "open");
}
/* drag-to-snap */
function initDrag(p, id) {
  const head = p.querySelector(".panel__head");
  head.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY; let dragging = false, ghost = null, hot = null;
    const zones = $("#snapzones");
    const move = ev => {
      if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
      if (!dragging) {
        dragging = true; p.classList.add("is-dragging"); zones.classList.add("on");
        ghost = el("div", "drag-ghost", `${ic(PANELS[id].icon, "sdl-icon--sm")}${esc(PANELS[id].title)}`); document.body.appendChild(ghost);
      }
      ghost.style.left = ev.clientX + 12 + "px"; ghost.style.top = ev.clientY + 12 + "px";
      const r = $("#ws").getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width, y = ev.clientY - r.top;
      hot = x < 0.26 ? "left" : x > 0.74 ? "right" : (y < 110 ? "max" : null);
      zones.querySelectorAll(".zone").forEach(z => z.classList.toggle("is-hot", z.dataset.z === hot));
    };
    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      if (!dragging) return;
      p.classList.remove("is-dragging"); zones.classList.remove("on"); ghost.remove();
      zones.querySelectorAll(".zone").forEach(z => z.classList.remove("is-hot"));
      if (hot === "max") { Object.keys(PANELS).forEach(k => PANELS[k].max = k === id); PANELS[id].state = "open"; layoutPanels(); }
      else if (hot) snapPanel(id, hot);
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
}

function confirmModal({ title, text, confirm, danger }) {
  return new Promise(res => {
    const prev = document.activeElement;
    const h = el("div", "modal-host"); h.setAttribute("role", "presentation");
    h.innerHTML = `<div class="sdl-modal" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><div class="sdl-modal__header"><span id="mdl-t" class="sdl-sbold">${title}</span><button class="sdl-icon-btn" data-x aria-label="Close" title="Close" style="margin-left:auto">${ic("close")}</button></div><div class="sdl-modal__body sdl-body-p">${text}</div><div class="sdl-modal__footer"><button class="sdl-btn sdl-btn--secondary" data-x>Cancel</button><button class="sdl-btn ${danger ? "sdl-btn--danger" : ""}" data-ok>${confirm}</button></div></div>`;
    const close = ok => { h.remove(); prev && prev.focus && prev.focus(); res(ok); };
    h.addEventListener("click", e => { if (e.target.closest("[data-ok]")) close(true); else if (e.target.closest("[data-x]") || e.target === h) close(false); });
    h.addEventListener("keydown", e => { if (e.key === "Escape") close(false); if (e.key === "Tab") { const f = [...h.querySelectorAll("button")]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } } });
    document.body.appendChild(h); h.querySelector("[data-ok]").focus();
  });
}

  if (t.dataset.memdel) {

/* ---------- Activity trace ---------- */
const TRACES = [];
const TYPE_ICON = { reasoning: "bulb", retrieval: "retrieval", read: "file", computation: "cog", system: "cog", generation: "ai", workflow: "arrowRight", approval: "shield", memory: "cog", agent: "subAgent", human: "user" };
const steps = n => `${n} ${n === 1 ? "step" : "steps"}`;
let tid = 0;
function newTrace(msg, title) {
  const t = { id: ++tid, title, running: true, items: [], collapsed: false, host: msg.slot, t0: performance.now(), msg };
  TRACES.push(t); renderTrace(t); return t;
}
function activeTrace() { for (let i = TRACES.length - 1; i >= 0; i--) if (TRACES[i].running) return TRACES[i]; return TRACES[TRACES.length - 1]; }
function activeTraceAdd(it) { const t = activeTrace(); if (t) return traceAdd(t, it); }
function traceAdd(t, it) {
  const item = Object.assign({ id: t.id + "-" + (t.items.length + 1), state: "running", type: "system", actor: "Travel Copilot", time: clock(), expanded: false }, it);
  t.items.push(item); renderTrace(t); return item;
}
function traceSet(t, item, patch) { Object.assign(item, patch); renderTrace(t); }
function traceFinish(t, title, state = "completed") {
  t.running = false; t.title = title; t.endState = state;
  t.meta = `${steps(t.items.length)} · ${((performance.now() - t.t0) / 1000).toFixed(1)}s · Agent: Travel Copilot`;
  t.collapsed = t.items.length > 4; renderTrace(t);
}
function itemCat(it) { return it.cat || (it.type === "approval" ? "approval" : ["retrieval", "read", "computation"].includes(it.type) || it.tool ? "tool" : "other"); }
function itemHTML(t, it, panel) {
  const glyph = { completed: "✓", warning: "!", failed: "×", running: "" }[it.state];
  return `<div class="sdl-trace-item sdl-trace-item--${it.state}${it.expanded ? " is-expanded" : ""}">
    <div class="sdl-trace-item__marker"><span class="sdl-trace-item__dot" style="font-size:10px;font-weight:700">${glyph}</span><span class="sdl-trace-item__line"></span></div>
    <div class="sdl-trace-item__body"><div class="sdl-trace-item__label" data-tid="${t.id}" data-iid="${it.id}" role="button" tabindex="0" aria-expanded="${it.expanded}">${ic(TYPE_ICON[it.type] || "cog")}<span>${panel ? `<span class="trace-actor">${esc(it.actor)}</span>` : ""}${it.label}</span>${panel ? `<span class="meta">${it.time}</span>` : ""}${it.detail ? ic(it.expanded ? "chevUp" : "chevDown", "sdl-icon--sm sdl-chev") : ""}</div>
    ${it.detail ? `<div class="sdl-trace-item__detail">${it.detail}</div>` : ""}</div></div>`;
}
function traceHTML(t, panel) {
  const items = panel && S.traceFilter !== "all" ? t.items.filter(i => S.traceFilter === "error" ? (i.state === "failed" || i.state === "warning") : itemCat(i) === S.traceFilter) : t.items;

    m.body.querySelectorAll("[data-src]").forEach(x => x.classList.toggle("is-on", x === b));
    const out = m.body.querySelector(".src-out"); const k = b.dataset.src;

    scrollChat();
  });

};

  };

SC["9.1"] = async run => {
  userMsg("Book the hotel now, please.");
  setRunning(true);
  const m = aiMsg(); const t = newTrace(m, "Booking NH Forsthaus");
  const a = traceAdd(t, { type: "system", label: "Holding room at NH Forsthaus…", tool: true }); await sleep(900, run);
  traceSet(t, a, { state: "completed", label: "Held room H-TMP-412 until 22:00" });
  const b = traceAdd(t, { type: "system", label: "Confirming booking and charging €417…", tool: true }); await sleep(1500, run);
  traceSet(t, b, { state: "failed", label: "Confirm booking failed: connection lost after 8 s", cat: "error", detail: kv([["Provider", "HRS"], ["Status", "Incident open on the HRS status page"], ["Charged", "€0, verified against the card feed"]]) });
  traceFinish(t, "Booking interrupted, state preserved", "failed");
  setRunning(false);
  aiMsg({ error: "One of the internal services I rely on is currently unavailable. In the meantime, is there anything else I can help you with?" });
  const ms = aiMsg();
  ms.add(`<div class="box"><div class="box__head">Booking state preserved</div>${kv([["Completed", "Room held (H-TMP-412). The hold survives the outage until 22:00"], ["Not done", "Confirmation and payment. <b>€0 charged</b>"], ["Your inputs", "Saved: dates, room type and approval, nothing to re-enter"], ["Cause", "HRS provider incident, not your request"]])}
    <div class="row-actions"><button class="sdl-btn sdl-btn--invisible-secondary sdl-btn--sm" data-r="release">Release hold</button><button class="sdl-btn sdl-btn--outline-secondary sdl-btn--sm" data-r="alt">Try another provider</button></div></div>`);
  ms.actions();
  const retry = async () => {
    const r2 = newRun(); setRunning(true);
    const x = aiMsg(); const t2 = newTrace(x, "Resuming from saved state");
    const c = traceAdd(t2, { type: "retrieval", label: "Re-verifying price before resuming…", tool: true });
    try { await sleep(900, r2); } catch (e) { return; }
    traceSet(t2, c, { state: "completed", label: "Price unchanged: €417" });
    const d = traceAdd(t2, { type: "system", label: "Confirming hold H-TMP-412…", tool: true });
    try { await sleep(1100, r2); } catch (e) { return; }
    traceSet(t2, d, { state: "completed", label: "Confirmed booking #H-99812, €417" });
    traceFinish(t2, "Hotel booked after recovery");
    x.add(`<p>${ic("success", "sdl-icon--sm")} Resumed from the saved state with the same hold and approval. Had the price changed, you'd have got a new approval block, never a silent charge.</p>`); done(t2, x);
  };
  msgBar("danger", "<b>Service unavailable.</b> Sorry, the service is unavailable or down for maintenance. Please try again later.", retry);
  ms.body.addEventListener("click", async e => {
    const btn = e.target.closest("[data-r]"); if (!btn) return;
    ms.body.querySelectorAll("[data-r]").forEach(z => z.disabled = true);
    $("#msgbar").innerHTML = "";
    const x = aiMsg();
    if (btn.dataset.r === "release") { x.add("<p>Hold released and state cleared. Nothing was charged.</p>"); x.actions(); }
    else { const t3 = newTrace(x, "Trying another provider"); const it = traceAdd(t3, { type: "retrieval", label: "Searching corporate booking partner…", tool: true }); await sleep(1100, S.runId).catch(() => {}); traceSet(t3, it, { state: "completed", label: "Same room at €431 (+€14), free cancellation" }); traceFinish(t3, "Alternative found"); x.add("<p>The same room is available for €431, €14 more, so it needs a normal approval before booking.</p>"); x.actions(); }
  });
};

/* ============================================================
   PATTERN GUIDE PANEL
   ============================================================ */
function setGuideTab(tab) { S.guideTab = tab; renderGuide(); PANELS.guide.body.scrollTop = 0; }
function renderGuide() {
  const B = PANELS.guide.body;
  const tabs = [["overview", "Overview"], ["map", "Pattern map"], ["pattern", "Pattern"]];
  let h = `<div class="guide max-wide"><div class="sdl-tabs" role="tablist">${tabs.map(([k, l]) => `<button class="sdl-tab${S.guideTab === k ? " is-selected" : ""}" data-gt="${k}" role="tab" aria-selected="${S.guideTab === k}"${k === "pattern" && !S.pattern ? " disabled" : ""}>${l}</button>`).join("")}</div><div class="guide__sec">`;
  if (S.guideTab === "overview") {
    h += `<div><h2>Agentic UX patterns on one standalone copilot</h2><p class="lead" style="margin-top:8px">Every demo uses the same agent, <b>Travel Copilot</b>, booking Anita Rao's Bangalore → Erlangen workshop trip under travel policy TRAVEL-07. ${ORDER.length} patterns from 10 families, built on the Siemens Design Language AI UX components.</p></div>
      <div><h5>Where things live</h5><div class="ov-surf">
        <div><b>${ic("ai")} Copilot</b>The conversation. The activity trace sits inline in each AI message, and approval blocks sit above the input and lock it until you decide.</div>
        <div><b>${ic("cog")} Agent Configuration Center</b>Its own main navigation item: the agent collection and the agent details panel for delegation, access tiers, memory, persona and the role contract.</div>
        <div><b>${ic("history")} Activity trace</b>Inline in each AI message by default. Pattern 5.4 opens it as a side panel with the full, filterable audit timeline.</div></div></div>
      <div><h5>Snapping panels</h5><div class="snap-legend">
        ${ic("grip")}<span>Drag a panel header to the left, right or top snap zone</span>
        ${ic("dockLeft")}<span>Snap to the left or right side</span>
        ${ic("maximize")}<span>Expand over the workspace (and restore)</span>
        ${ic("collapse")}<span>Collapse to an edge tab, then click the tab to reopen</span></div></div>
      <div class="guide-play"><button class="sdl-btn sdl-btn--outline-primary" data-start>Start with the first pattern</button><button class="sdl-btn sdl-btn--outline-secondary" data-gt="map">Open pattern map</button></div>`;
  }
  if (S.guideTab === "map") {
    h += `<p class="lead">The Agentic UX Patterns library has 10 families. Patterns marked <b>Demo</b> are interactive here.</p>`;
    CATS.forEach(c => {
      h += `<div class="fam"><div class="fam__h"><i style="--c:${c.c}"></i>${c.n} · ${esc(c.name)}</div>${c.all.map(full => { const id = full.split(" ")[0]; const nm = full.slice(id.length + 1); const has = ORDER.includes(id); return `<button class="pm-item ${has ? "has-demo" : "no-demo"}${S.pattern === id ? " is-selected" : ""}" ${has ? `data-pat="${id}"` : "disabled"}><span class="n">${id}</span><span>${esc(nm)}</span>${has ? `<span class="demo">Demo</span>` : ""}</button>`; }).join("")}</div>`;
    });
  }
  if (S.guideTab === "pattern" && S.pattern) {
    const p = byId[S.pattern], c = catOf(S.pattern), i = ORDER.indexOf(S.pattern);
    h += `<div><div class="cur-fam"><i style="--c:${c.c}"></i>${c.n} · ${esc(c.name)} · ${i + 1} of ${ORDER.length}</div><h2 style="margin-top:6px">${S.pattern} ${esc(p.name)}</h2><p class="lead" style="margin-top:6px">${esc(p.tagline)}</p></div>
      <div class="stage-note">${esc(NOTE[S.pattern])}</div>
      <div class="guide-play"><button class="sdl-btn sdl-btn--outline-primary" data-play>${ic("arrowRight", "sdl-icon--sm")} Play scenario</button><button class="sdl-btn sdl-btn--outline-secondary" data-reset>${ic("refresh", "sdl-icon--sm")} Reset</button>
        <span class="nav"><button class="sdl-icon-btn" data-prev title="Previous pattern" aria-label="Previous pattern" ${i <= 0 ? "disabled" : ""}>${ic("arrowLeft")}</button><button class="sdl-icon-btn" data-next title="Next pattern" aria-label="Next pattern" ${i >= ORDER.length - 1 ? "disabled" : ""}>${ic("arrowRight")}</button></span></div>
      <div class="sub-tabs">${[["why", "Why & when"], ["anatomy", "Anatomy"], ["dd", "Do & don't"]].map(([k, l]) => `<button class="sdl-filter-chip sdl-filter-chip--neutral${S.guideSub === k ? " is-selected" : ""}" data-gs="${k}">${l}</button>`).join("")}</div>`;
    if (S.guideSub === "why") h += `<p class="lead" style="color:var(--text-primary)">${esc(p.overview)}</p><div><h5>The problem</h5><ul class="dots">${p.problem.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><h5>Use it when</h5><ul class="dots">${p.useWhen.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>${p.overkillWhen.length ? `<div><h5>Probably overkill when</h5><ul class="dots mute">${p.overkillWhen.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}`;
    if (S.guideSub === "anatomy") h += `<div><h5>Anatomy</h5><div class="anat">${p.anatomy.map(a => `<div><b>${esc(a.label)}</b><span>${esc(a.desc)}</span></div>`).join("")}</div></div>${p.lifecycle.length ? `<div><h5>Behaviour &amp; lifecycle</h5><ol class="lc">${p.lifecycle.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : ""}${p.microcopy.length ? `<div><h5>Microcopy</h5><div class="micro">${p.microcopy.map(x => `<div>${esc(x)}</div>`).join("")}</div></div>` : ""}${p.a11y.length ? `<div><h5>Accessibility</h5><ul class="dots">${p.a11y.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}`;
    if (S.guideSub === "dd") h += `<div class="dd">${p.antiPatterns.map(a => `<div class="dont"><b>Don't</b>${esc(a.dont)}</div><div class="do"><b>Do</b>${esc(a.do)}</div>`).join("")}</div><p class="sdl-caption" style="line-height:1.45">Source demo in the library: ${esc(p.demoSummary)}</p>`;
  }
  h += `</div></div>`;
  B.innerHTML = h;
}
function guideClick(e) {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.gt) setGuideTab(b.dataset.gt);
  if (b.dataset.gs) { S.guideSub = b.dataset.gs; renderGuide(); }
  if (b.dataset.pat) showPattern(b.dataset.pat);
  if (b.hasAttribute("data-start")) showPattern(ORDER[0]);
  if (b.hasAttribute("data-play")) play();
  if (b.hasAttribute("data-reset")) resetDemo();
  if (b.hasAttribute("data-prev")) showPattern(ORDER[ORDER.indexOf(S.pattern) - 1]);
  if (b.hasAttribute("data-next")) showPattern(ORDER[ORDER.indexOf(S.pattern) + 1]);
}

/* ============================================================
   RUN CONTROL
   ============================================================ */
function resetData() { S.mode = "Co-Pilot"; setMode("Co-Pilot", true); S.memory = DEFAULT_MEMORY(); S.persona = { tone: "Concise", verbosity: "Short" }; S.tiers = DEFAULT_TIERS(); S.elevation = false; S.traceFilter = "all"; S.agents = ["travel"]; renderAgentChip(); }
function resetDemo() {
  newRun(); clearChat(); resetData();
  if (PANELS.details.state === "open") PANELS.details.state = "closed";
  if (S.traceSnapped && S.pattern !== "5.4") { /* keep the viewer's snap preference */ }
  PANELS.details.max = false; layoutPanels();
  if (!S.pattern) welcome();
}
function showPattern(id) {
  if (!id) return;
  S.pattern = id; S.guideSub = "why";
  if (S.traceSnapped) { S.traceSnapped = false; PANELS.trace.state = "closed"; PANELS.trace.max = false; }
  $("#hdr-crumb").textContent = `${id} ${byId[id].name}`;
  setGuideTab("pattern");
  if (PANELS.guide.max) { PANELS.guide.max = false; }
  if (isNarrow()) PANELS.guide.state = "collapsed";
  play();
}
async function play() {
  if (!S.pattern) return;
  setPage("copilot");
  resetDemo();
  if (PANELS.guide.max) { PANELS.guide.max = false; layoutPanels(); }
  const run = newRun();
  try { await SC[S.pattern](run); }
  catch (e) { if (!e || !e.cancelled) console.error(e); }
}
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea")) return;
  if (!S.pattern) return;
  const i = ORDER.indexOf(S.pattern);
  if (e.key === "ArrowRight" && i < ORDER.length - 1) showPattern(ORDER[i + 1]);
  if (e.key === "ArrowLeft" && i > 0) showPattern(ORDER[i - 1]);
});

/* ============================================================
   BOOT
   ============================================================ */
hydrateIcons();
renderAgentChip();
$("#hdr-guide").innerHTML = ic("info");
$("#hdr-guide").addEventListener("click", toggleGuide);
["guide", "trace", "details"].forEach(id => buildPanel(id));
PANELS.details.body.addEventListener("click", detailsClick);
PANELS.guide.body.addEventListener("click", guideClick);
renderGuide(); renderTracePanel(); renderDetails();
if (isNarrow()) PANELS.guide.state = "collapsed";
layoutPanels();
welcome();
const boot = location.hash.replace("#", "").replace("p", "");
if (ORDER.includes(boot)) showPattern(boot);
window.addEventListener("resize", () => { if (isNarrow()) { const open = Object.keys(PANELS).filter(k => PANELS[k].state === "open"); open.slice(1).forEach(k => PANELS[k].state = "collapsed"); layoutPanels(); } });

</script>
